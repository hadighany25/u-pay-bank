<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Credential - U-PAY</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: "Kantumruy Pro", sans-serif;
        background: #f8fafc;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .reset-container {
        background: white;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        text-align: center;
        max-width: 400px;
        width: 90%;
        border: 1px solid #e2e8f0;
      }
      .logo {
        width: 150px;
        margin-bottom: 20px;
      }
      .title {
        color: #0f172a;
        font-size: 1.5rem;
        margin-bottom: 10px;
        font-weight: 700;
      }
      .desc {
        color: #64748b;
        font-size: 0.9rem;
        margin-bottom: 30px;
        line-height: 1.5;
      }
      .form-group {
        text-align: left;
        margin-bottom: 20px;
        position: relative;
      }
      .label {
        font-size: 0.85rem;
        color: #475569;
        font-weight: 600;
        margin-bottom: 8px;
        display: block;
      }
      .input-box {
        width: 100%;
        padding: 14px 15px;
        border: 2px solid #cbd5e1;
        border-radius: 10px;
        font-size: 1.1rem;
        font-family: "Courier New", Courier, monospace;
        font-weight: bold;
        letter-spacing: 2px;
        text-align: center;
        box-sizing: border-box;
        outline: none;
        transition: 0.2s;
      }
      .input-box:focus {
        border-color: #10b981;
        box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
      }
      .toggle-icon {
        position: absolute;
        right: 15px;
        top: 40px;
        cursor: pointer;
        color: #94a3b8;
        font-size: 1.1rem;
      }
      .btn-submit {
        width: 100%;
        padding: 15px;
        background: #10b981;
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 1.1rem;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
        font-family: "Kantumruy Pro", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);
      }
      .btn-submit:hover {
        background: #059669;
        transform: translateY(-2px);
      }
      .success-box {
        display: none;
        padding: 40px 20px;
      }
      .success-icon-wrap {
        background: #10b981;
        width: 80px;
        height: 80px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
      }
    </style>
  </head>
  <body>
    <div class="reset-container" id="main-form">
      <img src="/images/logo.png" alt="U-PAY" class="logo" />
      <h2 class="title" id="page-title">កំណត់លេខសម្ងាត់ថ្មី</h2>
      <p class="desc" id="page-desc">សូមបញ្ចូលលេខថ្មីរបស់អ្នកខាងក្រោម។</p>

      <div class="form-group">
        <label class="label" id="label-new">បញ្ចូលលេខថ្មី (New)</label>
        <input type="password" id="val1" class="input-box" placeholder="••••" />
        <i
          class="fa-solid fa-eye-slash toggle-icon"
          onclick="toggleView('val1', this)"
        ></i>
      </div>
      <div class="form-group">
        <label class="label" id="label-confirm"
          >បញ្ជាក់លេខថ្មីម្តងទៀត (Confirm)</label
        >
        <input type="password" id="val2" class="input-box" placeholder="••••" />
        <i
          class="fa-solid fa-eye-slash toggle-icon"
          onclick="toggleView('val2', this)"
        ></i>
      </div>

      <button class="btn-submit" onclick="submitReset()">
        <i class="fa-solid fa-check"></i> រក្សាទុក
      </button>
    </div>

    <div class="reset-container success-box" id="success-form">
      <div class="success-icon-wrap">
        <i class="fa-solid fa-check" style="font-size: 3rem; color: white"></i>
      </div>
      <h2 class="title">ជោគជ័យ!</h2>
      <p class="desc">
        លេខសម្ងាត់របស់អ្នកត្រូវបានកំណត់ថ្មីដោយជោគជ័យ។
        ឥឡូវនេះអ្នកអាចត្រឡប់ទៅកម្មវិធី (App) ដើម្បីចូលប្រើប្រាស់បានហើយ។
      </p>
    </div>

    <script>
      // ទាញយក Parameter ពី URL
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get("token");
      const type = urlParams.get("type") || "PIN";

      // ប្តូរអត្ថបទតាមប្រភេទ
      if (type === "PIN") {
        document.getElementById("page-title").innerText = "កំណត់លេខ PIN ថ្មី";
        document.getElementById("page-desc").innerText =
          "សូមបញ្ចូលលេខ PIN ៤ ខ្ទង់ថ្មីរបស់អ្នកខាងក្រោម។";
        document.getElementById("val1").maxLength = 4;
        document.getElementById("val2").maxLength = 4;

        // Only allow numbers for PIN
        const forceNum = (e) => {
          e.target.value = e.target.value.replace(/[^0-9]/g, "");
        };
        document.getElementById("val1").addEventListener("input", forceNum);
        document.getElementById("val2").addEventListener("input", forceNum);
      } else {
        document.getElementById("page-title").innerText = "កំណត់ Password ថ្មី";
        document.getElementById("page-desc").innerText =
          "សូមបញ្ចូលលេខសម្ងាត់ថ្មីរបស់អ្នកខាងក្រោម។";
      }

      function toggleView(inputId, iconEl) {
        const input = document.getElementById(inputId);
        if (input.type === "password") {
          input.type = "text";
          iconEl.classList.remove("fa-eye-slash");
          iconEl.classList.add("fa-eye");
          iconEl.style.color = "#10b981";
        } else {
          input.type = "password";
          iconEl.classList.remove("fa-eye");
          iconEl.classList.add("fa-eye-slash");
          iconEl.style.color = "#94a3b8";
        }
      }

      async function submitReset() {
        if (!token)
          return Swal.fire(
            "កំហុស!",
            "មិនមាន Token សម្ងាត់ទេ។ សូមចុច Link ពី Email ម្តងទៀត។",
            "error",
          );

        const val1 = document.getElementById("val1").value;
        const val2 = document.getElementById("val2").value;

        if (!val1 || !val2)
          return Swal.fire("បញ្ជាក់!", "សូមបញ្ចូលលេខទាំង ២ ប្រអប់!", "warning");
        if (val1 !== val2)
          return Swal.fire(
            "បញ្ជាក់!",
            "លេខដែលអ្នកបញ្ជាក់មិនដូចគ្នាទេ!",
            "warning",
          );
        if (type === "PIN" && val1.length !== 4)
          return Swal.fire(
            "បញ្ជាក់!",
            "លេខ PIN ត្រូវតែមាន ៤ ខ្ទង់!",
            "warning",
          );

        Swal.fire({
          title: "កំពុងរក្សាទុក...",
          allowOutsideClick: false,
          didOpen: () => Swal.showLoading(),
        });

        try {
          const res = await fetch("/api/public/save-credential", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token: token, type: type, newValue: val1 }),
          });

          const data = await res.json();
          if (data.success) {
            Swal.close();
            document.getElementById("main-form").style.display = "none";
            document.getElementById("success-form").style.display = "block";
          } else {
            Swal.fire("បរាជ័យ", data.message, "error");
          }
        } catch (error) {
          Swal.fire("Error", "មានបញ្ហាតភ្ជាប់ទៅកាន់ Server", "error");
        }
      }
    </script>
  </body>
</html>

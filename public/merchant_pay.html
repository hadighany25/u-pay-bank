<!doctype html>
<html lang="km">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <link rel="icon" type="image/png" href="images/favicon.png" />
    <title>POS Terminal - U-Pay</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Kantumruy+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="js/lang.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/u-pay-core.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="js/pin.js"></script>
    <script src="js/slip.js"></script>

    <style>
      :root {
        --primary: #004d40;
        --secondary: #0d9488;
        --emerald: #10b981;
        --bg-main: #f1f5f9;
        --bg-card: #ffffff;
        --text-main: #0f172a;
        --text-muted: #64748b;
        --border-color: #e2e8f0;
        --danger: #ef4444;
      }

      body.dark-mode {
        --bg-main: #020617;
        --bg-card: #0f172a;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --border-color: #1e293b;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        font-family: "Kantumruy Pro", "Inter", sans-serif !important;
      }
      .fa-solid,
      .fa-regular,
      .fa-brands,
      .fa,
      .fas {
        font-family: "Font Awesome 6 Free" !important;
      }
      .mono-num {
        font-family: "JetBrains Mono", "Inter", monospace !important;
      }

      body {
        background-color: #0b1120;
        margin: 0;
        display: flex;
        justify-content: center;
        min-height: 100dvh;
        color: var(--text-main);
      }

      .app-container {
        width: 100%;
        max-width: 480px;
        height: 100dvh;
        background: var(--bg-main);
        display: flex;
        flex-direction: column;
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.25);
        overflow: hidden;
        position: relative;
      }

      .header-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 18px;
        background: linear-gradient(135deg, #00382e, #004d40);
        color: white;
      }
      .icon-circle-btn {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: none;
        background: rgba(255, 255, 255, 0.14);
        color: white;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 1rem;
        cursor: pointer;
      }

      /* ផ្ទៃបង្ហាញតួលេខគិតលុយ (Calculator Display) */
      .calc-display {
        background: linear-gradient(180deg, #004d40 0%, #00382e 100%);
        color: white;
        padding: 18px 20px 24px;
        text-align: center;
        flex-shrink: 0;
      }
      .calc-amount {
        font-size: 3.2rem;
        font-weight: 900;
        margin: 6px 0 12px;
        letter-spacing: -1px;
      }
      .calc-currency-toggle {
        display: inline-flex;
        background: rgba(255, 255, 255, 0.16);
        border-radius: 22px;
        padding: 4px;
        gap: 4px;
      }
      .calc-currency-toggle button {
        background: transparent;
        border: none;
        color: white;
        padding: 7px 20px;
        border-radius: 18px;
        font-weight: 800;
        cursor: pointer;
        transition: 0.2s;
      }
      .calc-currency-toggle button.active {
        background: #ffffff;
        color: #004d40;
      }
      .calc-currency-toggle button.hidden {
        display: none;
      }

      /* គ្រាប់ចុចលេខ (Keypad) */
      .keypad {
        flex: 1;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        background: var(--bg-card);
      }
      .key-btn {
        background: transparent;
        border: 1px solid var(--border-color);
        border-top: none;
        border-left: none;
        font-size: 1.55rem;
        font-weight: 700;
        color: var(--text-main);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background 0.12s;
      }
      .key-btn:active {
        background: rgba(13, 148, 136, 0.12);
      }
      .key-quick {
        background: rgba(13, 148, 136, 0.06);
        color: #0d9488;
        font-size: 1.05rem;
        font-weight: 800;
      }

      .calc-footer {
        padding: 14px 18px max(14px, env(safe-area-inset-bottom));
        background: var(--bg-card);
        display: flex;
        gap: 10px;
        border-top: 1px solid var(--border-color);
      }
      .btn-pos-qr {
        flex: 1;
        background: linear-gradient(135deg, #004d40, #0d9488);
        color: white;
        border: none;
        padding: 15px;
        border-radius: 16px;
        font-size: 1rem;
        font-weight: 800;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        box-shadow: 0 6px 18px rgba(13, 148, 136, 0.3);
      }

      /* 📱 ផ្ទាំងបង្ហាញ QR Code & Tap to Pay */
      .qr-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 50%;
        width: 100%;
        max-width: 480px;
        height: 100dvh;
        background: var(--bg-main);
        z-index: 2000;
        flex-direction: column;
        transform: translateX(-50%);
      }
      .qr-modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 18px;
      }
      .qr-card-container {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 8px 20px;
        overflow-y: auto;
      }
      .qr-white-box {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        width: 100%;
        max-width: 350px;
        padding: 24px 22px 22px;
        border-radius: 28px;
        box-shadow: 0 20px 40px -10px rgba(0, 77, 64, 0.14);
        text-align: center;
        position: relative;
      }

      .currency-toggle {
        display: flex;
        background: var(--bg-main);
        border-radius: 14px;
        padding: 4px;
        margin-bottom: 18px;
      }
      .toggle-btn {
        flex: 1;
        text-align: center;
        padding: 9px 0;
        font-size: 0.85rem;
        font-weight: 800;
        color: var(--text-muted);
        border-radius: 10px;
        cursor: pointer;
      }
      .toggle-btn.active {
        background: var(--bg-card);
        color: #0d9488;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }

      .qr-img-wrapper {
        background: #ffffff;
        padding: 14px;
        border-radius: 20px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin: 10px 0 12px;
        border: 1px solid #e2e8f0;
      }
      #myQrImg {
        width: 210px;
        height: 210px;
        display: block;
        border-radius: 10px;
      }

      .modern-amount-wrapper {
        background: var(--bg-main);
        border: 2px solid var(--border-color);
        border-radius: 16px;
        padding: 8px 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      #qrSetAmount {
        border: none;
        background: transparent;
        width: 150px;
        text-align: center;
        font-size: 2rem;
        font-weight: 900;
        color: #10b981;
        outline: none;
      }
      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }

      .round-tool-btn {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 1px solid var(--border-color);
        background: var(--bg-card);
        color: var(--text-main);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 1rem;
      }
      .round-tool-btn.active {
        background: rgba(16, 185, 129, 0.15);
        color: #10b981;
        border-color: rgba(16, 185, 129, 0.35);
      }

      /* 🌟 ធានាថា SweetAlert / Slip อยู่ชั้นบนสุด (Z-Index 99999) */
      .swal2-container {
        z-index: 99999 !important;
      }
    </style>
  </head>

  <body>
    <div class="app-container">
      <!-- ក្បាលម៉ាស៊ីន POS -->
      <div class="header-bar">
        <button type="button" class="icon-circle-btn" onclick="goBack()">
          <i class="fa-solid fa-arrow-left"></i>
        </button>
        <div style="text-align: center; min-width: 0; flex: 1">
          <h2
            id="recvStoreName"
            style="
              margin: 0;
              font-size: 1rem;
              font-weight: 900;
              white-space: nowrap;
              overflow: hidden;
              text-overflow: ellipsis;
            "
          >
            POS Terminal
          </h2>
          <span
            id="posCashierSubLabel"
            style="font-size: 0.7rem; opacity: 0.85"
          >
            ម៉ាស៊ីនគិតប្រាក់ឌីជីថល
          </span>
        </div>
        <button
          type="button"
          class="icon-circle-btn"
          id="topVoiceQuickBtn"
          onclick="toggleVoiceAlert()"
          title="បិទ/បើកសំឡេងហៅលុយចូលសម្រាប់ហាងនេះ"
        >
          <i class="fa-solid fa-volume-high" id="topVoiceQuickIcon"></i>
        </button>
      </div>

      <!-- អេក្រង់បង្ហាញចំនួនទឹកប្រាក់ -->
      <div class="calc-display">
        <div style="font-size: 0.8rem; opacity: 0.85; font-weight: 600">
          បញ្ចូលចំនួនទឹកប្រាក់ត្រូវទូទាត់
        </div>
        <div class="calc-amount mono-num">
          <span id="calcSym">$</span><span id="calcDisplay">0</span>
        </div>
        <div class="calc-currency-toggle">
          <button
            type="button"
            id="btnCurUSD"
            class="active mono-num"
            onclick="setCalcCur('USD')"
          >
            USD ($)
          </button>
          <button
            type="button"
            id="btnCurKHR"
            class="mono-num"
            onclick="setCalcCur('KHR')"
          >
            KHR (៛)
          </button>
        </div>
      </div>

      <!-- គ្រាប់ចុចលេខគិតលុយ -->
      <div class="keypad">
        <button type="button" class="key-btn mono-num" onclick="pressKey('1')">
          1
        </button>
        <button type="button" class="key-btn mono-num" onclick="pressKey('2')">
          2
        </button>
        <button type="button" class="key-btn mono-num" onclick="pressKey('3')">
          3
        </button>
        <button
          type="button"
          class="key-btn key-quick mono-num"
          onclick="pressKey('00')"
        >
          00
        </button>

        <button type="button" class="key-btn mono-num" onclick="pressKey('4')">
          4
        </button>
        <button type="button" class="key-btn mono-num" onclick="pressKey('5')">
          5
        </button>
        <button type="button" class="key-btn mono-num" onclick="pressKey('6')">
          6
        </button>
        <button
          type="button"
          class="key-btn key-quick mono-num"
          onclick="pressKey('000')"
        >
          000
        </button>

        <button type="button" class="key-btn mono-num" onclick="pressKey('7')">
          7
        </button>
        <button type="button" class="key-btn mono-num" onclick="pressKey('8')">
          8
        </button>
        <button type="button" class="key-btn mono-num" onclick="pressKey('9')">
          9
        </button>
        <button
          type="button"
          class="key-btn"
          style="color: var(--danger)"
          onclick="pressKey('C')"
        >
          <i class="fa-solid fa-delete-left"></i>
        </button>

        <button type="button" class="key-btn mono-num" onclick="pressKey('.')">
          .
        </button>
        <button type="button" class="key-btn mono-num" onclick="pressKey('0')">
          0
        </button>
        <button
          type="button"
          class="key-btn"
          style="
            grid-column: span 2;
            font-size: 0.9rem;
            font-weight: 800;
            color: var(--text-muted);
          "
          onclick="
            calcValue = '';
            updateCalcDisplay();
          "
        >
          សម្អាត (Clear)
        </button>
      </div>

      <div class="calc-footer">
        <button type="button" class="btn-pos-qr" onclick="generateQRFromCalc()">
          <i class="fa-solid fa-qrcode"></i>
          <span>បង្ហាញ KHQR & ស្កេនកាត NFC</span>
        </button>
      </div>

      <!-- 📱 ផ្ទាំងបង្ហាញ QR Code & Tap to Pay -->
      <div id="qrModal" class="qr-modal">
        <div class="qr-modal-header">
          <button type="button" class="round-tool-btn" onclick="closeQRModal()">
            <i class="fa-solid fa-xmark"></i>
          </button>

          <div style="display: flex; gap: 8px; align-items: center">
            <!-- ប្តូរភាសាសំឡេងនិយាយផ្ទាល់លើអេក្រង់ QR -->
            <button
              type="button"
              id="btnVoiceLangSwitch"
              onclick="cycleShopVoiceLang()"
              style="
                height: 40px;
                padding: 0 12px;
                border-radius: 20px;
                border: 1px solid var(--border-color);
                background: var(--bg-card);
                color: var(--text-main);
                font-weight: 800;
                font-size: 0.78rem;
                cursor: pointer;
              "
            >
              🇰🇭 ខ្មែរ
            </button>

            <button
              type="button"
              class="round-tool-btn active"
              id="btnVoiceToggle"
              onclick="toggleVoiceAlert()"
              title="បិទ/បើកសំឡេង"
            >
              <i class="fa-solid fa-volume-high" id="iconVoiceToggle"></i>
            </button>

            <button
              type="button"
              class="round-tool-btn"
              onclick="downloadMyQR()"
              id="btnSaveQR"
              title="ទាញយករូបភាព QR"
            >
              <i class="fa-solid fa-download"></i>
            </button>
          </div>
        </div>

        <div class="qr-card-container">
          <div class="qr-white-box" id="myQRContent">
            <div class="currency-toggle" id="qrToggleBar">
              <div
                class="toggle-btn active mono-num"
                id="btnQRUSD"
                onclick="switchQRCurrency('USD')"
              >
                USD ($)
              </div>
              <div
                class="toggle-btn mono-num"
                id="btnQRKHR"
                onclick="switchQRCurrency('KHR')"
              >
                KHR (៛)
              </div>
            </div>

            <div
              id="qrStaticCurrencyBadge"
              class="mono-num"
              style="
                display: none;
                margin-bottom: 16px;
                background: rgba(16, 185, 129, 0.12);
                padding: 6px 14px;
                border-radius: 12px;
                color: #10b981;
                font-weight: 900;
                font-size: 0.85rem;
              "
            >
              USD ($)
            </div>

            <!-- រូបឡូហ្គោហាង និងឈ្មោះហាង -->
            <div
              id="qrShopLogoWrap"
              style="
                width: 48px;
                height: 48px;
                border-radius: 14px;
                background: linear-gradient(135deg, #004d40, #0d9488);
                color: white;
                margin: 0 auto 8px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 1.3rem;
                overflow: hidden;
              "
            >
              <i class="fa-solid fa-store"></i>
            </div>

            <h3
              id="qrUserName"
              style="
                margin: 0;
                font-size: 1.25rem;
                font-weight: 900;
                text-transform: uppercase;
              "
            >
              ...
            </h3>
            <p
              id="qrMerchantID"
              class="mono-num"
              style="
                margin: 4px 0 8px;
                font-size: 0.78rem;
                color: var(--text-muted);
              "
            ></p>

            <div class="qr-img-wrapper">
              <img id="myQrImg" src="" alt="QR Code" />
            </div>

            <p
              id="qrAccountNum"
              class="mono-num"
              style="
                margin: 0 0 14px;
                font-weight: 800;
                color: #0d9488;
                font-size: 1.05rem;
                letter-spacing: 1px;
              "
            ></p>

            <div
              style="
                border-top: 1px dashed var(--border-color);
                padding-top: 14px;
              "
            >
              <div
                style="
                  font-size: 0.75rem;
                  color: var(--text-muted);
                  font-weight: 700;
                  margin-bottom: 8px;
                "
              >
                ចំនួនទឹកប្រាក់ត្រូវបង់ (AMOUNT)
              </div>
              <div class="modern-amount-wrapper">
                <span
                  id="qrCurrencySymbol"
                  class="mono-num"
                  style="
                    font-size: 1.6rem;
                    font-weight: 900;
                    color: var(--text-muted);
                  "
                  >$</span
                >
                <input
                  type="number"
                  id="qrSetAmount"
                  class="mono-num"
                  placeholder="0.00"
                  min="0"
                  oninput="
                    if (this.value < 0) this.value = Math.abs(this.value);
                    updateMyQR();
                  "
                />
              </div>
            </div>
          </div>
        </div>

        <div
          style="
            padding: 14px 20px max(16px, env(safe-area-inset-bottom));
            display: flex;
            justify-content: center;
          "
        >
          <button
            type="button"
            onclick="startTapToPay()"
            id="btnTapToPay"
            style="
              width: 100%;
              max-width: 350px;
              padding: 16px;
              background: linear-gradient(135deg, #059669, #10b981);
              color: white;
              border: none;
              border-radius: 18px;
              font-weight: 900;
              font-size: 1rem;
              cursor: pointer;
              display: flex;
              align-items: center;
              justify-content: center;
              gap: 10px;
              box-shadow: 0 10px 22px rgba(16, 185, 129, 0.32);
            "
          >
            <i class="fa-solid fa-wifi" style="transform: rotate(90deg)"></i>
            <span>ស្កេនកាត NFC (Tap to Pay)</span>
          </button>
        </div>
      </div>
    </div>

    <script>
      let currentMerchant = null;
      let calcValue = "";
      let calcCurrency = "USD";
      let qrCurrency = "USD";
      let isProcessingNFC = false;
      let isCashierQR = false;
      let currentCashierObj = null;

      let merchHasUSD = false;
      let merchHasKHR = false;

      let shopVoiceOn = true;
      let shopVoiceProfile = "km_female_1";
      let posAudioCtx = null;

      document.addEventListener("DOMContentLoaded", () => {
        if (window.currentUser) {
          const userThemeKey = "theme_" + window.currentUser.username;
          if (localStorage.getItem(userThemeKey) === "dark") {
            document.body.classList.add("dark-mode");
          }
          initPOS();
        }
      });

      function getShopStoragePrefix() {
        return `shop_${currentMerchant?.id || "default"}_`;
      }

      const POS_VOICE_PROFILES = {
        km_female_1: {
          lang: "km",
          gender: "female",
          pitchRate: 1.0,
          label: "🇰🇭 👩 សុភា",
        },
        km_male_1: {
          lang: "km",
          gender: "male",
          pitchRate: 0.82,
          label: "🇰🇭 👨 វិបុល",
        },
        km_female_2: {
          lang: "km",
          gender: "female",
          pitchRate: 1.12,
          label: "🇰🇭 👧 នារី",
        },
        en_female_1: {
          lang: "en",
          gender: "female",
          pitchRate: 1.0,
          label: "🇺🇸 👩 Emma",
        },
        en_male_1: {
          lang: "en",
          gender: "male",
          pitchRate: 0.83,
          label: "🇺🇸 👨 David",
        },
        en_female_2: {
          lang: "en",
          gender: "female",
          pitchRate: 1.1,
          label: "🇬🇧 👩‍💼 Sophia",
        },
      };
      const POS_VOICE_KEYS = Object.keys(POS_VOICE_PROFILES);

      function loadPerShopVoiceSettings() {
        if (!currentMerchant) return;
        const prefix = getShopStoragePrefix();
        const savedOn = localStorage.getItem(prefix + "voiceOn");
        let savedProf =
          localStorage.getItem(prefix + "voiceLang") ||
          currentMerchant.settings?.voiceLang ||
          "km_female_1";

        if (savedProf === "km") savedProf = "km_female_1";
        if (savedProf === "en") savedProf = "en_female_1";
        if (!POS_VOICE_PROFILES[savedProf]) savedProf = "km_female_1";

        shopVoiceOn =
          savedOn !== null
            ? savedOn === "true"
            : currentMerchant.settings?.voiceEnabled !== false;
        shopVoiceProfile = savedProf;

        updateVoiceToggleUI();
      }

      function updateVoiceToggleUI() {
        const btn = document.getElementById("btnVoiceToggle");
        const icon = document.getElementById("iconVoiceToggle");
        const topIcon = document.getElementById("topVoiceQuickIcon");
        const langBtn = document.getElementById("btnVoiceLangSwitch");

        if (btn && icon) {
          btn.classList.toggle("active", shopVoiceOn);
          icon.className = shopVoiceOn
            ? "fa-solid fa-volume-high"
            : "fa-solid fa-volume-xmark";
        }
        if (topIcon) {
          topIcon.className = shopVoiceOn
            ? "fa-solid fa-volume-high"
            : "fa-solid fa-volume-xmark";
        }
        if (langBtn) {
          const prof =
            POS_VOICE_PROFILES[shopVoiceProfile] ||
            POS_VOICE_PROFILES.km_female_1;
          langBtn.innerText = prof.label;
        }
      }

      window.toggleVoiceAlert = function () {
        shopVoiceOn = !shopVoiceOn;
        localStorage.setItem(
          getShopStoragePrefix() + "voiceOn",
          String(shopVoiceOn),
        );
        updateVoiceToggleUI();
        if (shopVoiceOn) {
          playVoiceAlert(0, "TEST");
        }
      };

      window.cycleShopVoiceLang = async function () {
        const idx = POS_VOICE_KEYS.indexOf(shopVoiceProfile);
        shopVoiceProfile = POS_VOICE_KEYS[(idx + 1) % POS_VOICE_KEYS.length];
        localStorage.setItem(
          getShopStoragePrefix() + "voiceLang",
          shopVoiceProfile,
        );
        updateVoiceToggleUI();

        if (shopVoiceOn) {
          playVoiceAlert(0, "TEST");
        }

        if (currentMerchant?.id) {
          fetch(`/api/merchants/update/${currentMerchant.id}`, {
            method: "PUT",
            headers: window.authHeaders,
            body: JSON.stringify({
              settings: {
                voiceEnabled: shopVoiceOn,
                voiceLang: shopVoiceProfile,
              },
            }),
          }).catch(() => {});
        }
      };

      function formatAmountForSpeech(amount, lang) {
        const str = String(amount || "0")
          .replace(/,/g, "")
          .trim();
        if (!str.includes(".")) return str;
        const [intPart, decPart] = str.split(".");
        if (!decPart || Number(decPart) === 0) return intPart;
        return lang === "km"
          ? `${intPart} ចុច ${decPart}`
          : `${intPart} point ${decPart}`;
      }

      async function playVoiceAlert(amount, currency) {
        if (!shopVoiceOn) return;
        const prof =
          POS_VOICE_PROFILES[shopVoiceProfile] ||
          POS_VOICE_PROFILES.km_female_1;

        let textToSpeak = "";
        if (currency === "TEST") {
          textToSpeak =
            prof.lang === "km"
              ? "សួស្តី នេះជាសំឡេងជូនដំណឹងរបស់ហាង"
              : "Hello, store voice alert is ready";
        } else {
          const spokenAmt = formatAmountForSpeech(amount, prof.lang);
          const curWordKm = currency === "USD" ? "ដុល្លារ" : "រៀល";
          const curWordEn =
            currency === "USD" ? "US Dollars" : "Cambodian Riel";
          textToSpeak =
            prof.lang === "km"
              ? `ទទួលបាន ${spokenAmt} ${curWordKm}`
              : `Payment received ${spokenAmt} ${curWordEn}`;
        }

        try {
          const url = `/api/merchants/tts?lang=${prof.lang}&text=${encodeURIComponent(textToSpeak)}`;
          const res = await fetch(url);
          if (!res.ok) throw new Error("TTS Stream failed");

          const arrayBuf = await res.arrayBuffer();
          const AudioCtx = window.AudioContext || window.webkitAudioContext;

          if (AudioCtx) {
            if (!posAudioCtx) posAudioCtx = new AudioCtx();
            if (posAudioCtx.state === "suspended") await posAudioCtx.resume();

            const audioBuffer = await posAudioCtx.decodeAudioData(arrayBuf);
            const source = posAudioCtx.createBufferSource();
            source.buffer = audioBuffer;
            source.playbackRate.value = prof.pitchRate;

            if (prof.gender === "male") {
              const filter = posAudioCtx.createBiquadFilter();
              filter.type = "lowshelf";
              filter.frequency.value = 260;
              filter.gain.value = 5;
              source.connect(filter);
              filter.connect(posAudioCtx.destination);
            } else {
              source.connect(posAudioCtx.destination);
            }

            source.start(0);
            return;
          }
        } catch (e) {}

        if ("speechSynthesis" in window) {
          window.speechSynthesis.cancel();
          const msg = new SpeechSynthesisUtterance(textToSpeak);
          msg.lang = prof.lang === "km" ? "km-KH" : "en-US";
          msg.pitch = prof.gender === "male" ? 0.7 : prof.pitchRate;
          msg.rate = 0.95;
          window.speechSynthesis.speak(msg);
        }
      }

      function initPOS() {
        const urlParams = new URLSearchParams(window.location.search);
        const mid = urlParams.get("mid");
        const cashierAcc = urlParams.get("cashierAcc");
        const openQrNow = urlParams.get("openQr") === "1";

        if (!mid) return goBack();

        currentMerchant = (
          window.currentUser.merchantProfile?.merchants || []
        ).find((m) => (m.id || m._id) === mid);

        if (!currentMerchant) return goBack();

        loadPerShopVoiceSettings();

        if (cashierAcc && Array.isArray(currentMerchant.cashiers)) {
          currentCashierObj = currentMerchant.cashiers.find(
            (c) => c.accountNumber === cashierAcc,
          );
          if (currentCashierObj) isCashierQR = true;
        }

        const displayName = isCashierQR
          ? `${currentMerchant.name} (${currentCashierObj.displayName})`
          : currentMerchant.name;

        document.getElementById("recvStoreName").innerText = displayName;
        document.getElementById("qrUserName").innerText = currentMerchant.name;
        document.getElementById("posCashierSubLabel").innerText = isCashierQR
          ? `អ្នកគិតលុយ៖ ${currentCashierObj.originalName}`
          : `MID: #${currentMerchant.merchantId}`;

        const logoBox = document.getElementById("qrShopLogoWrap");
        if (logoBox && currentMerchant.logo) {
          logoBox.innerHTML = `<img src="${currentMerchant.logo}" style="width:100%; height:100%; object-fit:cover" />`;
        }

        if (isCashierQR) {
          merchHasUSD = Boolean(currentCashierObj.virtualAccounts?.USD);
          merchHasKHR = Boolean(currentCashierObj.virtualAccounts?.KHR);
        } else {
          merchHasUSD = Boolean(currentMerchant.accountNumbers?.USD);
          merchHasKHR = Boolean(currentMerchant.accountNumbers?.KHR);
        }

        document
          .getElementById("btnCurUSD")
          .classList.toggle("hidden", !merchHasUSD);
        document
          .getElementById("btnCurKHR")
          .classList.toggle("hidden", !merchHasKHR);

        if (merchHasUSD) setCalcCur("USD");
        else if (merchHasKHR) setCalcCur("KHR");

        if (openQrNow) {
          openQRModal("", merchHasUSD ? "USD" : "KHR");
        }

        try {
          const socket = io();
          socket.emit("joinRoom", window.currentUser.username);
          socket.on("paymentReceived", (data) => {
            new Audio(
              "https://notificationsounds.com/storage/sounds/file-sounds-1148-juntos.mp3",
            )
              .play()
              .catch(() => {});
            playVoiceAlert(data.amount, data.currency);

            // 🌟 ១. បិទផ្ទាំង QR Modal ទាំងស្រុងមុនគេបង្អស់
            closeQRModal();
            if (Swal.isVisible()) Swal.close();

            // 🌟 ២. បើកបង្ហាញវិក្កយបត្រ (Transaction Slip) ឱ្យលោតឡើងមកពីក្រោមយ៉ាងរលូន (Z-Index 99999)
            if (typeof openGlobalSlip === "function") {
              openGlobalSlip({
                refId: data.refId || "POS-" + Date.now(),
                date: new Date().toLocaleString("en-US", {
                  timeZone: "Asia/Phnom_Penh",
                  hour12: true,
                }),
                type: "Received",
                amount: data.amount,
                currency: data.currency,
                senderName: data.senderName || "Customer",
                receiverName: currentMerchant.name,
                status: "Success",
                trxMethod: "KHQR / POS",
              });
            } else {
              Swal.fire({
                icon: "success",
                title: "ទទួលបានការទូទាត់ជោគជ័យ! 🎉",
                text: `+${data.amount} ${data.currency} ពី ${data.senderName}`,
                confirmButtonColor: "#004d40",
              });
            }
          });
        } catch (e) {}
      }

      function goBack() {
        window.location.href = "merchant.html";
      }

      function setCalcCur(cur) {
        if (cur === "USD" && !merchHasUSD) return;
        if (cur === "KHR" && !merchHasKHR) return;
        calcCurrency = cur;
        document
          .getElementById("btnCurUSD")
          .classList.toggle("active", cur === "USD");
        document
          .getElementById("btnCurKHR")
          .classList.toggle("active", cur === "KHR");
        document.getElementById("calcSym").innerText =
          cur === "USD" ? "$" : "៛";
        updateCalcDisplay();
      }

      function pressKey(key) {
        if (key === "C") {
          calcValue = calcValue.slice(0, -1);
        } else if (key === ".") {
          if (calcCurrency === "KHR") return;
          if (!calcValue.includes(".")) calcValue = (calcValue || "0") + ".";
        } else {
          if (calcValue === "0" && key !== "00" && key !== "000") {
            calcValue = key;
          } else if (calcValue.length < 10) {
            calcValue += key;
          }
        }
        updateCalcDisplay();
      }

      function updateCalcDisplay() {
        if (!calcValue) {
          document.getElementById("calcDisplay").innerText = "0";
          return;
        }
        const parts = calcValue.split(".");
        parts[0] = Number(parts[0] || 0).toLocaleString("en-US");
        document.getElementById("calcDisplay").innerText = parts.join(".");
      }

      function generateQRFromCalc() {
        openQRModal(calcValue, calcCurrency);
        calcValue = "";
        updateCalcDisplay();
      }

      function openQRModal(amount, currency = null) {
        let targetCur = currency || (merchHasUSD ? "USD" : "KHR");
        if (
          (targetCur === "USD" && !merchHasUSD) ||
          (targetCur === "KHR" && !merchHasKHR)
        ) {
          targetCur = merchHasUSD ? "USD" : "KHR";
        }

        const toggleBar = document.getElementById("qrToggleBar");
        const staticBadge = document.getElementById("qrStaticCurrencyBadge");

        if (amount && parseFloat(amount) > 0) {
          document.getElementById("qrSetAmount").readOnly = true;
          toggleBar.style.display = "none";
          staticBadge.style.display = "block";
          staticBadge.innerText = targetCur === "USD" ? "USD ($)" : "KHR (៛)";
        } else {
          document.getElementById("qrSetAmount").readOnly = false;
          if (merchHasUSD && merchHasKHR) {
            toggleBar.style.display = "flex";
            staticBadge.style.display = "none";
          } else {
            toggleBar.style.display = "none";
            staticBadge.style.display = "block";
            staticBadge.innerText = merchHasUSD ? "USD ($)" : "KHR (៛)";
          }
        }

        switchQRCurrency(targetCur);
        document.getElementById("qrSetAmount").value = amount || "";
        updateMyQR();
        document.getElementById("qrModal").style.display = "flex";
      }

      function closeQRModal() {
        document.getElementById("qrModal").style.display = "none";
      }

      function switchQRCurrency(currency) {
        if (currency === "USD" && !merchHasUSD) return;
        if (currency === "KHR" && !merchHasKHR) return;

        qrCurrency = currency;
        document
          .getElementById("btnQRUSD")
          .classList.toggle("active", currency === "USD");
        document
          .getElementById("btnQRKHR")
          .classList.toggle("active", currency === "KHR");
        document.getElementById("qrCurrencySymbol").innerText =
          currency === "USD" ? "$" : "៛";

        if (!document.getElementById("qrSetAmount").readOnly) {
          document.getElementById("qrSetAmount").value = "";
        }

        if (isCashierQR) {
          const vAcc = currentCashierObj.virtualAccounts
            ? currentCashierObj.virtualAccounts[currency]
            : currentCashierObj.virtualAccount;
          document.getElementById("qrAccountNum").textContent = vAcc || "N/A";
          document.getElementById("qrMerchantID").textContent =
            `Cashier: ${currentCashierObj.originalName}`;
        } else {
          const targetAcc = currentMerchant.accountNumbers
            ? currentMerchant.accountNumbers[currency]
            : null;
          document.getElementById("qrAccountNum").textContent =
            targetAcc || "N/A";
          document.getElementById("qrMerchantID").textContent =
            `MID: #${currentMerchant.merchantId}`;
        }
        updateMyQR();
      }

      function updateMyQR() {
        const amount = document.getElementById("qrSetAmount").value;
        let qrData = "";
        const qrColor = isCashierQR ? "0284c7" : "004d40";

        if (isCashierQR) {
          const vAcc = currentCashierObj.virtualAccounts
            ? currentCashierObj.virtualAccounts[qrCurrency]
            : currentCashierObj.virtualAccount;
          if (vAcc) {
            qrData =
              amount && parseFloat(amount) > 0 ? `${vAcc}:${amount}` : vAcc;
          }
        } else {
          const targetAcc = currentMerchant.accountNumbers
            ? currentMerchant.accountNumbers[qrCurrency]
            : null;
          qrData =
            amount && parseFloat(amount) > 0
              ? `${targetAcc}:${amount}`
              : targetAcc || "";
        }

        document.getElementById("myQrImg").src =
          `https://quickchart.io/qr?text=${encodeURIComponent(qrData)}&dark=${qrColor}&size=400&margin=1`;
      }

      function downloadMyQR() {
        html2canvas(document.getElementById("myQRContent"), {
          backgroundColor: document.body.classList.contains("dark-mode")
            ? "#0f172a"
            : "#ffffff",
          scale: 3,
        }).then((canvas) => {
          const link = document.createElement("a");
          link.download = `KHQR-${currentMerchant.name.replace(/\s+/g, "-")}.png`;
          link.href = canvas.toDataURL();
          link.click();
        });
      }

      // 💳 NFC Tap to Pay
      function normalizeUID(uid) {
        if (!uid) return "";
        uid = String(uid).trim().toUpperCase();
        if (/^\d{10}$/.test(uid)) {
          const hex = parseInt(uid, 10)
            .toString(16)
            .toUpperCase()
            .padStart(8, "0");
          return (
            hex.substring(6, 8) +
            hex.substring(4, 6) +
            hex.substring(2, 4) +
            hex.substring(0, 2)
          );
        }
        return uid;
      }

      async function processNFCScan(serialNumber, amount, qrCurrency) {
        if (isProcessingNFC) return;
        isProcessingNFC = true;
        if (serialNumber)
          serialNumber = serialNumber.replaceAll(":", "").toUpperCase();

        Swal.fire({
          title: "កំពុងពិនិត្យកាត NFC...",
          allowOutsideClick: false,
          didOpen: () => Swal.showLoading(),
        });

        try {
          const checkRes = await fetch("/api/merchants/check-card", {
            method: "POST",
            headers: window.authHeaders,
            body: JSON.stringify({
              uid: serialNumber,
              amount,
              currency: qrCurrency,
            }),
          });
          const checkData = await checkRes.json();
          if (!checkData.success) {
            isProcessingNFC = false;
            return Swal.fire("មិនអាចទូទាត់បាន", checkData.message, "error");
          }
        } catch (e) {
          isProcessingNFC = false;
          return Swal.fire("Error", "មិនអាចភ្ជាប់ទៅកាន់ Server បានទេ", "error");
        }

        const requirePin =
          (qrCurrency === "USD" && amount > 20) ||
          (qrCurrency === "KHR" && amount > 80000);

        if (requirePin) {
          requestPinVerification(
            "បញ្ជាក់លេខកូដ PIN កាត",
            `ទឹកប្រាក់ ${qrCurrency === "USD" ? "$" : "៛"}${amount.toLocaleString()} លើសកម្រិតស្កេនរហ័ស`,
            function (pin) {
              executeTapPayment(serialNumber, amount, qrCurrency, pin);
            },
            function () {
              isProcessingNFC = false;
            },
          );
        } else {
          executeTapPayment(serialNumber, amount, qrCurrency, null);
        }
      }

      async function executeTapPayment(uid, amount, currency, pin) {
        Swal.fire({
          title: "កំពុងទូទាត់ប្រាក់...",
          allowOutsideClick: false,
          didOpen: () => Swal.showLoading(),
        });

        try {
          const res = await fetch("/api/merchants/tap-to-pay", {
            method: "POST",
            headers: window.authHeaders,
            body: JSON.stringify({
              uid,
              amount,
              currency,
              pin,
              merchantId: currentMerchant.id,
              cashierAcc: isCashierQR ? currentCashierObj.accountNumber : null,
            }),
          });
          const data = await res.json();
          if (data.success) {
            Swal.close();
            new Audio(
              "https://notificationsounds.com/storage/sounds/file-sounds-1148-juntos.mp3",
            )
              .play()
              .catch(() => {});
            playVoiceAlert(amount, currency);

            // 🌟 ១. បិទផ្ទាំង QR Modal ទាំងស្រុងមុនគេបង្អស់
            closeQRModal();
            if (Swal.isVisible()) Swal.close();

            // 🌟 ២. បើកបង្ហាញវិក្កយបត្រ (Transaction Slip) ឱ្យលោតឡើងមកពីក្រោមយ៉ាងរលូន (Z-Index 99999)
            if (typeof openGlobalSlip === "function") {
              openGlobalSlip({
                refId: "POS-" + Date.now(),
                date: new Date().toLocaleString("en-US", {
                  timeZone: "Asia/Phnom_Penh",
                  hour12: true,
                }),
                type: "Received",
                amount: amount,
                currency: currency,
                senderName: "NFC Cardholder",
                receiverName: currentMerchant.name,
                status: "Success",
                trxMethod: "NFC Tap to Pay",
              });
            } else {
              Swal.fire("ជោគជ័យ!", "ការទូទាត់ដោយកាត NFC បានសម្រេច!", "success");
            }
          } else {
            Swal.fire("បរាជ័យ!", data.message, "error");
          }
        } catch (err) {
          Swal.fire("Error", "Server Error", "error");
        } finally {
          isProcessingNFC = false;
        }
      }

      async function startTapToPay() {
        if (isProcessingNFC) return;
        const amount = parseFloat(document.getElementById("qrSetAmount").value);
        if (!amount || amount <= 0) {
          return Swal.fire(
            "បញ្ជាក់",
            "សូមបញ្ចូលចំនួនទឹកប្រាក់ជាមុនសិន!",
            "warning",
          );
        }

        // 🌟 ៣. បិទ QR Modal ជាមុនសិន ពេលកំពុងរង់ចាំស្កេន NFC ដើម្បីកុំឱ្យបាំងអេក្រង់
        closeQRModal();

        let isScanning = true;
        let scanBuffer = "";

        Swal.fire({
          title: "សូមដាក់កាត NFC ជិតម៉ាស៊ីនស្កេន...",
          html: `
            <div style="margin:20px 0"><i class="fa-solid fa-wifi fa-beat" style="font-size:4rem; color:#10b981; transform:rotate(90deg)"></i></div>
            <h2 class="mono-num" style="color:#10b981; margin:0">${qrCurrency === "USD" ? "$" : "៛"}${amount.toLocaleString()}</h2>
            <input type="text" id="hiddenUsbScannerInput" style="opacity:0; position:absolute; z-index:-1" autocomplete="off">
          `,
          showCancelButton: true,
          showConfirmButton: false,
          cancelButtonText: "បោះបង់",
          allowOutsideClick: false,
          customClass: { popup: "premium-swal" },
          didOpen: () => {
            const hiddenInput = document.getElementById(
              "hiddenUsbScannerInput",
            );
            if (hiddenInput) {
              hiddenInput.focus();
              hiddenInput.addEventListener("blur", () => {
                if (isScanning) setTimeout(() => hiddenInput.focus(), 10);
              });
              hiddenInput.addEventListener("keydown", function (e) {
                if (e.code === "Enter" || e.code === "NumpadEnter") {
                  if (scanBuffer.length >= 4) {
                    isScanning = false;
                    Swal.close();
                    processNFCScan(
                      normalizeUID(scanBuffer),
                      amount,
                      qrCurrency,
                    );
                  }
                  scanBuffer = "";
                } else {
                  scanBuffer += e.key;
                }
              });
            }
          },
          didClose: () => {
            isScanning = false;
          },
        });

        if ("NDEFReader" in window) {
          const abortController = new AbortController();
          Swal.getPopup().addEventListener("cancel", () =>
            abortController.abort(),
          );
          try {
            const ndef = new NDEFReader();
            await ndef.scan({ signal: abortController.signal });
            ndef.onreading = async (event) => {
              if (!isScanning) return;
              isScanning = false;
              abortController.abort();
              Swal.close();
              processNFCScan(
                normalizeUID(event.serialNumber),
                amount,
                qrCurrency,
              );
            };
          } catch (error) {}
        }
      }
    </script>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <link rel="icon" type="image/png" href="images/favicon.png" />
    <title>Smart Scan AI - U-Pay</title>

    <!-- 📦 បណ្ដុំ Script សំខាន់ៗ -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="js/lang.js"></script>

    <!-- 🚀 NEW AI QR SCANNER ENGINE -->
    <script src="https://unpkg.com/qr-scanner@1.4.2/qr-scanner.umd.min.js"></script>

    <!-- 🔤 បណ្ដុំ Fonts និង Icons -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Kantumruy+Pro:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      /* ==========================================
         🚀 GLOBAL & FOUC PREVENTION
         ========================================== */
      :root {
        --primary: #00b894;
        --primary-dark: #004d40;
      }
      body {
        background-color: #000;
        margin: 0;
        font-family: "Kantumruy Pro", "Inter", sans-serif;
        overflow: hidden;
        visibility: hidden;
        opacity: 0;
        display: flex;
        justify-content: center;
        min-height: 100vh;
        transition: opacity 0.4s ease;
        -webkit-font-smoothing: antialiased;
      }
      body.loaded {
        visibility: visible;
        opacity: 1;
      }
      .kh-text {
        font-family: "Kantumruy Pro", "Inter", sans-serif !important;
      }

      /* ==========================================
         📱 APP CONTAINER & VIDEO
         ========================================== */
      .app-container {
        width: 100%;
        max-width: 450px;
        height: 100vh;
        position: relative;
        background: #000;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #qr-video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1;
        transition: transform 0.3s ease-out;
      }

      /* ==========================================
         📷 HEADER
         ========================================== */
      .scan-header {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 20;
        padding: 30px 20px 20px;
        box-sizing: border-box;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.8) 0%,
          rgba(0, 0, 0, 0) 100%
        );
      }
      .back-link {
        color: white;
        font-size: 1.4rem;
        text-decoration: none;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(10px);
        transition: 0.2s;
      }
      .back-link:active {
        transform: scale(0.9);
        background: rgba(255, 255, 255, 0.3);
      }
      .header-title {
        color: white;
        font-weight: 700;
        letter-spacing: 1px;
        font-size: 1.1rem;
      }

      /* ==========================================
         🎯 SMART SCAN UI (ABA Style)
         ========================================== */
      .scan-overlay-ui {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 10;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.4);
        clip-path: polygon(
          0% 0%,
          0% 100%,
          100% 100%,
          100% 0%,
          0% 0%,
          calc(50% - 135px) calc(50% - 160px),
          calc(50% + 135px) calc(50% - 160px),
          calc(50% + 135px) calc(50% + 110px),
          calc(50% - 135px) calc(50% + 110px),
          calc(50% - 135px) calc(50% - 160px)
        );
      }
      .scan-focus-box {
        position: absolute;
        width: 270px;
        height: 270px;
        top: calc(50% - 160px);
        left: calc(50% - 135px);
        border-radius: 24px;
        z-index: 12;
      }
      .focus-corner {
        position: absolute;
        width: 45px;
        height: 45px;
        border: 4px solid var(--primary);
        border-radius: 12px;
        transition: all 0.3s ease;
      }
      .c-tl {
        top: -2px;
        left: -2px;
        border-right: none;
        border-bottom: none;
        border-top-left-radius: 24px;
      }
      .c-tr {
        top: -2px;
        right: -2px;
        border-left: none;
        border-bottom: none;
        border-top-right-radius: 24px;
      }
      .c-bl {
        bottom: -2px;
        left: -2px;
        border-right: none;
        border-top: none;
        border-bottom-left-radius: 24px;
      }
      .c-br {
        bottom: -2px;
        right: -2px;
        border-left: none;
        border-top: none;
        border-bottom-right-radius: 24px;
      }

      .scan-laser {
        position: absolute;
        width: 90%;
        left: 5%;
        height: 2px;
        background: var(--primary);
        box-shadow: 0 0 15px 3px var(--primary);
        animation: smartScan 2s infinite cubic-bezier(0.4, 0, 0.2, 1);
        border-radius: 50%;
      }
      @keyframes smartScan {
        0% {
          top: 10px;
          opacity: 0;
        }
        15% {
          opacity: 1;
        }
        85% {
          opacity: 1;
        }
        100% {
          top: 250px;
          opacity: 0;
        }
      }

      .scan-text {
        position: absolute;
        top: calc(50% + 140px);
        color: white;
        font-size: 0.95rem;
        letter-spacing: 0.5px;
        background: rgba(0, 0, 0, 0.6);
        padding: 8px 16px;
        border-radius: 20px;
        backdrop-filter: blur(5px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      /* ==========================================
         🎛️ CONTROLS (BOTTOM)
         ========================================== */
      .scan-controls {
        position: absolute;
        bottom: 50px;
        width: 100%;
        z-index: 20;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 40px;
      }
      .control-btn {
        width: 65px;
        height: 65px;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 50%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-size: 1.4rem;
        color: white;
        backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        cursor: pointer;
        transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      }
      .control-btn span {
        font-size: 0.65rem;
        margin-top: 4px;
        font-weight: 600;
        font-family: "Inter", sans-serif;
        opacity: 0.9;
      }
      .control-btn:active {
        transform: scale(0.85);
        background: rgba(255, 255, 255, 0.3);
      }
      .btn-myqr {
        background: var(--primary);
        border: none;
        transform: scale(1.1);
        box-shadow: 0 10px 25px rgba(0, 184, 148, 0.4);
      }
      .btn-myqr:active {
        transform: scale(0.95);
      }

      /* ==========================================
         🔥 MODAL "MY QR"
         ========================================== */
      .qr-modal {
        display: none;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #f1f5f9;
        z-index: 100;
        flex-direction: column;
        align-items: center;
        animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      @keyframes slideUp {
        from {
          transform: translateY(100%);
        }
        to {
          transform: translateY(0);
        }
      }
      .qr-card-container {
        flex: 1;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        box-sizing: border-box;
      }
      .qr-white-box {
        background: #ffffff;
        width: 100%;
        max-width: 350px;
        padding: 30px 25px;
        border-radius: 30px;
        box-shadow: 0 20px 40px -10px rgba(0, 77, 64, 0.1);
        text-align: center;
        position: relative;
        box-sizing: border-box;
        transition:
          background 0.3s ease,
          border-color 0.3s ease;
      }

      .account-selector {
        width: 100%;
        padding: 12px 15px;
        border-radius: 14px;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        color: #1e293b;
        font-size: 0.95rem;
        font-family: "Kantumruy Pro", "Inter", sans-serif;
        font-weight: 600;
        margin-bottom: 20px;
        outline: none;
        appearance: none;
        background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2364748b%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
        background-repeat: no-repeat;
        background-position: right 15px top 50%;
        background-size: 12px auto;
        transition: all 0.3s;
        cursor: pointer;
      }
      .account-selector:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(0, 184, 148, 0.1);
      }

      .qr-logo-top {
        height: 40px;
        margin-bottom: 10px;
        transition: filter 0.3s ease;
      }
      .qr-user-name {
        margin: 0;
        font-size: 1.2rem;
        color: #1e293b;
        font-weight: 700;
        text-transform: uppercase;
        transition: color 0.3s ease;
      }
      .qr-user-acc {
        margin: 5px 0 20px;
        color: var(--primary);
        font-family: "JetBrains Mono", monospace;
        font-size: 1.1rem;
        font-weight: 700;
        letter-spacing: 1px;
      }

      .qr-img-wrapper {
        background: #ffffff;
        padding: 15px;
        border-radius: 20px;
        display: inline-block;
        margin-bottom: 25px;
        border: 1px solid #e2e8f0;
        box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.02);
        position: relative;
      }
      #myQrImg {
        width: 220px;
        height: 220px;
        display: block;
        border-radius: 12px;
      }
      .qr-center-logo {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 45px;
        height: 45px;
        background: #ffffff;
        border-radius: 10px;
        padding: 4px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        z-index: 5;
      }

      .amount-input-area {
        border-top: 1px dashed #e2e8f0;
        padding-top: 20px;
        width: 100%;
        transition: border-color 0.3s ease;
      }
      .amount-label {
        font-size: 0.8rem;
        color: #64748b;
        font-weight: 600;
        margin-bottom: 10px;
        transition: color 0.3s ease;
      }
      .amount-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
      }
      .currency-symbol {
        font-size: 1.5rem;
        font-weight: 700;
        color: #94a3b8;
        margin-top: -2px;
        transition: color 0.3s ease;
      }
      #qrSetAmount {
        border: none;
        background: transparent;
        width: 160px;
        text-align: center;
        font-size: 2.2rem;
        font-weight: 700;
        color: var(--primary-dark);
        outline: none;
        font-family: "JetBrains Mono", sans-serif;
        transition: color 0.3s ease;
      }
      #qrSetAmount::placeholder {
        color: #cbd5e1;
      }

      .btn-save-qr {
        width: calc(100% - 40px);
        max-width: 350px;
        padding: 18px;
        background: var(--primary-dark);
        color: white;
        border: none;
        border-radius: 20px;
        font-weight: bold;
        font-size: 1.1rem;
        margin-bottom: 30px;
        cursor: pointer;
        transition: 0.3s;
        box-shadow: 0 10px 20px rgba(0, 77, 64, 0.2);
      }
      .btn-save-qr:active {
        transform: scale(0.96);
      }
      .close-qr-btn {
        position: absolute;
        top: 25px;
        left: 20px;
        font-size: 1.2rem;
        color: #1e293b;
        cursor: pointer;
        background: #fff;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        border: 1px solid #e2e8f0;
        transition: 0.3s;
      }
      .close-qr-btn:active {
        transform: scale(0.9);
      }

      /* ==========================================
         🌙 DARK MODE OVERRIDES
         ========================================== */
      body.dark-mode .qr-modal {
        background-color: #121212 !important;
      }
      body.dark-mode .qr-white-box {
        background-color: #1e1e1e !important;
        border: 1px solid #333 !important;
        box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.8) !important;
      }
      body.dark-mode .qr-img-wrapper {
        background: #ffffff !important;
        border-color: #333 !important;
      }
      body.dark-mode .qr-user-name,
      body.dark-mode .amount-label,
      body.dark-mode .currency-symbol {
        color: #ffffff !important;
      }
      body.dark-mode #qrSetAmount {
        color: #10b981 !important;
      }
      body.dark-mode .qr-logo-top {
        filter: brightness(0) invert(1) !important;
      }
      body.dark-mode .amount-input-area {
        border-top-color: #444 !important;
      }
      body.dark-mode .account-selector {
        background-color: #2a2a2a !important;
        border-color: #444 !important;
        color: #fff !important;
        background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23ffffff%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
      }
      body.dark-mode .close-qr-btn {
        background-color: #333 !important;
        color: #fff !important;
        border: none !important;
      }
    </style>
  </head>
  <body>
    <div class="app-container">
      <!-- កាមេរ៉ា -->
      <video id="qr-video"></video>

      <div class="scan-header">
        <a href="dashboard.html" class="back-link"
          ><i class="fa-solid fa-chevron-left"></i
        ></a>
        <span class="header-title" data-lang="title_scan">SCAN QR</span>
        <div style="width: 40px"></div>
      </div>

      <!-- UI ប្រអប់ស្កេនទំនើប -->
      <div class="scan-overlay-ui">
        <div class="scan-focus-box">
          <div class="focus-corner c-tl"></div>
          <div class="focus-corner c-tr"></div>
          <div class="focus-corner c-bl"></div>
          <div class="focus-corner c-br"></div>
          <div class="scan-laser"></div>
        </div>
      </div>
      <div class="scan-text kh-text" data-lang="scan_desc">
        ដាក់កូដ QR ក្នុងប្រអប់ដើម្បីស្កេន
      </div>

      <!-- ប៊ូតុងបញ្ជា -->
      <div class="scan-controls">
        <div
          class="control-btn"
          onclick="document.getElementById('qr-input-file').click()"
        >
          <i class="fa-regular fa-image"></i>
          <span>Gallery</span>
        </div>
        <div class="control-btn btn-myqr" onclick="showMyQR()">
          <i class="fa-solid fa-qrcode"></i>
          <span>My QR</span>
        </div>
        <div class="control-btn" id="flashBtn" onclick="toggleFlash()">
          <i class="fa-solid fa-bolt"></i>
          <span>Flash</span>
        </div>
      </div>

      <!-- Input សម្រាប់រើសរូបពី Gallery -->
      <input
        type="file"
        id="qr-input-file"
        accept="image/*"
        style="display: none"
      />

      <!-- 🔥 MODAL MY QR -->
      <div id="qrModal" class="qr-modal">
        <div class="close-qr-btn" onclick="closeMyQR()">
          <i class="fa-solid fa-xmark"></i>
        </div>

        <div class="qr-card-container">
          <div class="qr-white-box" id="myQRContent">
            <select
              id="accountSelector"
              class="account-selector"
              onchange="updateAccountSelection()"
            ></select>

            <img src="images/logo-nobg.png" class="qr-logo-top" alt="U-Pay" />
            <h3 id="qrUserName" class="qr-user-name">...</h3>
            <p id="qrUserAcc" class="qr-user-acc">...</p>

            <div class="qr-img-wrapper">
              <img id="myQrImg" src="" alt="QR Code" />
              <img
                src="images/logo-nobg.png"
                class="qr-center-logo"
                alt="logo"
              />
            </div>

            <div class="amount-input-area">
              <div class="amount-label kh-text" data-lang="set_amount">
                កំណត់ទឹកប្រាក់ចង់បាន
              </div>
              <div class="amount-row">
                <span class="currency-symbol" id="qrCurrencySymbol">$</span>
                <input
                  type="number"
                  id="qrSetAmount"
                  placeholder="0.00"
                  oninput="updateMyQR()"
                />
              </div>
            </div>
          </div>
        </div>

        <button
          onclick="downloadMyQR()"
          class="btn-save-qr kh-text"
          id="btnSaveQR"
        >
          <i class="fa-solid fa-download" style="margin-right: 8px"></i>
          <span data-lang="save_qr">រក្សាទុកក្នុងទូរស័ព្ទ</span>
        </button>
      </div>
    </div>

    <script>
      // ==========================================
      // 1. SECURITY & CONFIG
      // ==========================================
      let user = JSON.parse(sessionStorage.getItem("user"));
      let token = sessionStorage.getItem("userToken");
      if (!user || !token) window.location.href = "index.html";

      // Worker សម្រាប់អោយកាមេរ៉ាស្កេនបានលឿននិងមិនគាំង
      QrScanner.WORKER_PATH =
        "https://unpkg.com/qr-scanner@1.4.2/qr-scanner-worker.min.js";

      let qrScanner = null;
      let isFlashOn = false;

      // ==========================================
      // 2. THEME & INIT
      // ==========================================
      function applyTheme() {
        const userThemeKey = "darkMode_" + user.username;
        const isDark =
          localStorage.getItem("theme") === "dark" ||
          localStorage.getItem(userThemeKey) === "true";
        if (isDark) document.body.classList.add("dark-mode");
        else document.body.classList.remove("dark-mode");
      }

      document.addEventListener("DOMContentLoaded", () => {
        applyTheme();
        if (typeof applyLanguage === "function") applyLanguage();
        document.body.classList.add("loaded");
        populateAccounts();
        initScannerLogic();
      });

      // ==========================================
      // 3. AI SCANNER LOGIC & CAMERA HANDLING
      // ==========================================
      function initScannerLogic() {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get("showQR") === "true") {
          document.querySelector(".scan-overlay-ui").style.display = "none";
          document.querySelector(".scan-controls").style.display = "none";
          document.querySelector(".scan-text").style.display = "none";
          const modal = document.getElementById("qrModal");
          modal.style.animation = "none";
          modal.style.display = "flex";
          document.body.style.backgroundColor =
            document.body.classList.contains("dark-mode")
              ? "#121212"
              : "#f1f5f9";
        } else {
          startSmartScanner();
        }
      }

      async function startSmartScanner() {
        const videoElem = document.getElementById("qr-video");

        qrScanner = new QrScanner(
          videoElem,
          (result) => handleScanResult(result.data),
          {
            onDecodeError: (error) => {}, // បិទ Error រំខាន
            highlightScanRegion: true,
            highlightCodeOutline: true,
            returnDetailedScanResult: true,
          },
        );

        try {
          await qrScanner.start();

          qrScanner.hasCamera().then((hasCamera) => {
            if (hasCamera) {
              const videoTrack = videoElem.srcObject.getVideoTracks()[0];
              const capabilities = videoTrack.getCapabilities();
              if (capabilities.zoom) {
                const targetZoom = Math.min(capabilities.zoom.max, 1.8);
                videoTrack
                  .applyConstraints({ advanced: [{ zoom: targetZoom }] })
                  .catch((e) => {});
              }
            }
          });
        } catch (err) {
          console.warn("Camera Issue:", err.message);
          // បង្ហាញ Error តែម្តងគត់រាល់ពេលចូល មិនអោយលោតរំខានរហូតទេ
          if (!sessionStorage.getItem("cameraErrorShown")) {
            Swal.fire({
              icon: "error",
              title: "មិនអាចបើកកាមេរ៉ាបានទេ!",
              text: "សូមអនុញ្ញាតសិទ្ធិ (Camera Permission) នៅក្នុង Browser របស់អ្នក។",
              confirmButtonColor: "#00b894",
            });
            sessionStorage.setItem("cameraErrorShown", "true");
          }
        }
      }
      // ==========================================
      // 4. ROUTING LOGIC (ប្រើ Regex ចាប់ទាញយកទិន្នន័យដោយបង្ខំ ទោះ Link ខូចទ្រង់ទ្រាយក៏ដោយ)
      // ==========================================
      function handleScanResult(decodedText) {
        if (qrScanner) qrScanner.stop();

        new Audio(
          "https://notificationsounds.com/storage/sounds/file-sounds-1148-juntos.mp3",
        )
          .play()
          .catch(() => {});
        console.log("QR Data:", decodedText);

        // 🌟 ដំណោះស្រាយទី១: បើវាជា Full URL (មាន http) យើងទាញយកតែ Query Params មកប្រើ
        try {
          if (decodedText.startsWith("http") || decodedText.includes("://")) {
            let urlObj = new URL(decodedText);
            let acc = urlObj.searchParams.get("acc");
            let amount = urlObj.searchParams.get("amount");

            // បើចាប់បាន acc គឺយើងបញ្ជូនទៅ transfer.html ផ្ទាល់តែម្តង (មិនឲ្យលោតកាត់ Login ទេ)
            if (acc) {
              let redirectUrl = `transfer.html?acc=${acc}&source=qr`;
              if (amount) redirectUrl += `&amount=${amount}`;
              window.location.href = redirectUrl;
              return;
            }
          }
        } catch (e) {
          console.log("Not a valid URL, fallback to normal scan");
        }

        // 🌟 ដំណោះស្រាយទី២: បើវាជា Relative Link (មានពាក្យ acc= តែមិនមាន http ពីមុខ)
        if (decodedText.includes("acc=")) {
          try {
            // កាត់យកតែអ្វីដែលនៅក្រោយសញ្ញា ?
            let queryString = decodedText.includes("?")
              ? decodedText.substring(decodedText.indexOf("?"))
              : decodedText;
            let urlParams = new URLSearchParams(queryString);
            let acc = urlParams.get("acc");
            let amount = urlParams.get("amount");

            if (acc) {
              let redirectUrl = `transfer.html?acc=${acc}&source=qr`;
              if (amount) redirectUrl += `&amount=${amount}`;
              window.location.href = redirectUrl;
              return;
            }
          } catch (e) {}
        }

        // 🌟 ដំណោះស្រាយទី៣: ករណីស្កេន U-Fund
        if (decodedText.startsWith("UFND-")) {
          window.location.href = `transfer.html?acc=${decodedText}&source=qr`;
          return;
        }

        // 🌟 ដំណោះស្រាយទី៤: ករណីស្កេន QR គណនីមានចាក់សោលុយ (ឧ. 888888888:5.00)
        let targetAcc = decodedText;
        let targetAmount = "";
        let lockMoney = false;

        if (decodedText.includes(":")) {
          const parts = decodedText.split(":");
          targetAcc = parts[0];
          targetAmount = parts[1];
          lockMoney = true;
        }

        // 🌟 ដំណោះស្រាយទី៥: ករណី QR ជាលេខគណនីធម្មតា ឬលេខកូដវិក័យប័ត្រ (ORD-...)
        // អនុញ្ញាតឲ្យរត់ទៅ Transfer បើប្រវែងវាលើសពី ៥ ខ្ទង់
        if (targetAcc.length >= 5) {
          let url = `transfer.html?acc=${targetAcc}&source=qr`;
          if (targetAmount) {
            url += `&amount=${targetAmount}`;
            if (lockMoney) url += `&lockAmount=true`;
          }
          window.location.href = url;
        } else {
          // បើមិនចូលលក្ខខណ្ឌណាសោះ (QR មិនត្រឹមត្រូវ) ទើបលោត Error
          Swal.fire({
            icon: "error",
            title: "បរាជ័យ",
            text: "កូដ QR មិនត្រឹមត្រូវឬមិនគាំទ្រ!",
            confirmButtonColor: "#00b894",
          }).then(() => startSmartScanner());
        }
      }

      // ==========================================
      // 5. SCAN FROM GALLERY & FLASH
      // ==========================================
      const fileInput = document.getElementById("qr-input-file");
      fileInput.addEventListener("change", (event) => {
        const file = event.target.files[0];
        if (!file) return;

        if (qrScanner) qrScanner.stop();
        Swal.fire({
          title: "កំពុងវិភាគ...",
          didOpen: () => Swal.showLoading(),
        });

        QrScanner.scanImage(file, { returnDetailedScanResult: true })
          .then((result) => {
            Swal.close();
            handleScanResult(result.data);
          })
          .catch((e) => {
            Swal.close();
            Swal.fire({
              icon: "error",
              title: "រកមិនឃើញកូដ QR ទេ!",
              confirmButtonColor: "#00b894",
            }).then(() => startSmartScanner());
          });
      });

      function toggleFlash() {
        if (!qrScanner) return;
        isFlashOn = !isFlashOn;
        qrScanner.hasFlash().then((hasFlash) => {
          if (hasFlash) {
            isFlashOn ? qrScanner.turnFlashOn() : qrScanner.turnFlashOff();
            const btn = document.getElementById("flashBtn");
            btn.style.background = isFlashOn
              ? "white"
              : "rgba(255, 255, 255, 0.15)";
            btn.style.color = isFlashOn ? "#000" : "white";
          } else {
            Swal.fire({
              icon: "info",
              title: "ទូរស័ព្ទរបស់អ្នកគ្មានភ្លើង Flash ទេ",
              toast: true,
              position: "top",
              timer: 3000,
              showConfirmButton: false,
            });
          }
        });
      }

      // ==========================================
      // 6. MY QR MODAL LOGIC
      // ==========================================
      let qrCurrency = "USD";

      function populateAccounts() {
        const selector = document.getElementById("accountSelector");
        selector.innerHTML = "";

        let optUSD = document.createElement("option");
        optUSD.value = user.accountNumber;
        optUSD.dataset.currency = "USD";
        optUSD.dataset.accName = user.fullName || user.username;
        optUSD.textContent = `Main USD - ${user.accountNumber}`;
        selector.appendChild(optUSD);

        if (user.accountNumberKHR) {
          let optKHR = document.createElement("option");
          optKHR.value = user.accountNumberKHR;
          optKHR.dataset.currency = "KHR";
          optKHR.dataset.accName = user.fullName || user.username;
          optKHR.textContent = `Main KHR - ${user.accountNumberKHR}`;
          selector.appendChild(optKHR);
        }

        if (user.subAccounts && user.subAccounts.length > 0) {
          user.subAccounts.forEach((acc) => {
            let opt = document.createElement("option");
            opt.value = acc.accountNumber;
            opt.dataset.currency = acc.currency;
            opt.dataset.accName = acc.accountName;
            let typeLabel =
              acc.accountType === "joint" || acc.accountType === "joint_member"
                ? "Joint"
                : "Premium";
            opt.textContent = `${acc.accountName} (${typeLabel} ${acc.currency}) - ${acc.accountNumber}`;
            selector.appendChild(opt);
          });
        }
        updateAccountSelection();
      }

      function updateAccountSelection() {
        const selector = document.getElementById("accountSelector");
        const selectedOpt = selector.options[selector.selectedIndex];
        qrCurrency = selectedOpt.dataset.currency;
        document.getElementById("qrCurrencySymbol").innerText =
          qrCurrency === "USD" ? "$" : "៛";
        document.getElementById("qrUserName").textContent =
          selectedOpt.dataset.accName;
        document.getElementById("qrUserAcc").textContent =
          selectedOpt.value.replace(/(\d{3})(\d{3})(\d{3})/, "$1 $2 $3");
        updateMyQR();
      }

      function updateMyQR() {
        const amount = document.getElementById("qrSetAmount").value;
        const targetAcc = document.getElementById("accountSelector").value;
        let qrData =
          amount && amount > 0 ? `${targetAcc}:${amount}` : targetAcc;
        const qrColor = qrCurrency === "USD" ? "004d40" : "059669";
        document.getElementById("myQrImg").src =
          `https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=${qrData}&color=${qrColor}&ecc=H`;
      }

      function showMyQR() {
        if (qrScanner) qrScanner.stop();
        document.getElementById("qrModal").style.display = "flex";
      }

      function closeMyQR() {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get("showQR") === "true") {
          window.location.href = "dashboard.html";
        } else {
          document.getElementById("qrModal").style.display = "none";
          startSmartScanner();
        }
      }

      function downloadMyQR() {
        const btnSave = document.getElementById("btnSaveQR");
        const btnClose = document.querySelector(".close-qr-btn");
        const selector = document.getElementById("accountSelector");
        btnSave.style.display = "none";
        btnClose.style.display = "none";
        selector.style.display = "none";

        const isDark = document.body.classList.contains("dark-mode");
        html2canvas(document.getElementById("myQRContent"), {
          backgroundColor: isDark ? "#1e1e1e" : "#ffffff",
          scale: 3,
        }).then((canvas) => {
          const link = document.createElement("a");
          link.download = `U-Pay-QR-${user.username}-${qrCurrency}.png`;
          link.href = canvas.toDataURL();
          link.click();
          btnSave.style.display = "block";
          btnClose.style.display = "flex";
          selector.style.display = "block";
        });
      }

      // ==========================================
      // 7. SOCKET.IO (Live Payment Notification)
      // ** មានតែមួយគត់ មិនជាន់គ្នាទៀតទេ **
      // ==========================================
      const socket = io("https://u-pay-bank.fly.dev");
      socket.emit("joinRoom", user.username);

      socket.on("paymentReceived", (data) => {
        const ringtone = new Audio(
          "https://notificationsounds.com/storage/sounds/file-sounds-1148-juntos.mp3",
        );
        ringtone
          .play()
          .catch((e) => console.log("Audio blocked by browser", e));

        const amountInput = document.getElementById("qrSetAmount").value;
        const isAmountSet = amountInput && parseFloat(amountInput) > 0;
        const symbol = data.currency === "USD" ? "$" : "៛";
        const formattedAmount = Number(data.amount).toLocaleString("en-US", {
          minimumFractionDigits: 2,
        });

        if (isAmountSet) {
          // ករណីគេស្កេនពី QR ដែលមានកំណត់លុយ (លោតធំ ហើយរុញទៅ Dashboard)
          Swal.fire({
            icon: "success",
            title: '<span style="font-family: Kantumruy Pro">លុយចូលហើយ!</span>',
            html: `<span style="font-family: Kantumruy Pro">អ្នកទទួលបាន <b>${symbol}${formattedAmount}</b> ពី ${data.senderName}</span>`,
            confirmButtonText: "យល់ព្រម",
            confirmButtonColor: "#00b894",
            allowOutsideClick: false,
          }).then(() => {
            window.location.href = "dashboard.html";
          });
        } else {
          // ករណីស្កេនធម្មតា អត់កំណត់លុយ (លោត Toast តូចៗ)
          const Toast = Swal.mixin({
            toast: true,
            position: "top-end",
            showConfirmButton: false,
            timer: 4000,
            timerProgressBar: true,
            didOpen: (toast) => {
              toast.addEventListener("mouseenter", Swal.stopTimer);
              toast.addEventListener("mouseleave", Swal.resumeTimer);
            },
          });
          Toast.fire({
            icon: "success",
            title: `<span style="font-family: Kantumruy Pro">ទទួលបាន ${symbol}${formattedAmount} ពី ${data.senderName}</span>`,
          });
        }
      });
    </script>
  </body>
</html>

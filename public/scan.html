<!-- public/scan.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <link rel="icon" type="image/png" href="images/favicon.png" />
    <title>Smart Scan AI - U-Pay</title>

    <!-- 📦 បណ្ដុំ Script សំខាន់ៗ -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/lang.js"></script>

    <!-- 🚀 NEW AI QR SCANNER ENGINE -->
    <script src="https://unpkg.com/qr-scanner@1.4.2/qr-scanner.umd.min.js"></script>

    <!-- 🔤 បណ្ដុំ Fonts និង Icons -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      /* ==========================================
         🚀 GLOBAL & THEME STYLES (Light & Dark Mode)
         ========================================== */
      :root {
        --primary: #00b894;
        --primary-dark: #004d40;
        --bg-main: #f1f5f9;
        --text-main: #1e293b;
      }

      body.dark-mode {
        --bg-main: #121212;
        --text-main: #ffffff;
      }

      body {
        background-color: #cbd5e1;
        margin: 0;
        font-family: "Kantumruy Pro", "Inter", sans-serif;
        overflow: hidden;
        visibility: hidden;
        opacity: 0;
        display: flex;
        justify-content: center;
        min-height: 100vh;
        transition: opacity 0.4s ease;
        -webkit-font-smoothing: antialiased;
      }
      body.loaded {
        visibility: visible;
        opacity: 1;
      }
      .kh-text {
        font-family: "Kantumruy Pro", "Inter", sans-serif !important;
      }

      /* ==========================================
         📱 APP CONTAINER & VIDEO
         ========================================== */
      .app-container {
        width: 100%;
        max-width: 480px;
        height: 100dvh; /* 🌟 ប្រើ 100dvh ដើម្បីអោយពេញទំហំទូរស័ព្ទត្រឹមត្រូវ (មិនបាត់បាតក្រោម) */
        position: relative;
        background: var(--bg-main);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-shadow: 0 0 25px rgba(0, 0, 0, 0.15);
      }

      #qr-video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1;
      }

      /* ==========================================
         📷 HEADER
         ========================================== */
      .scan-header {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 20;
        padding: 20px;
        box-sizing: border-box;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.7) 0%,
          rgba(0, 0, 0, 0) 100%
        );
      }
      .back-link {
        color: white;
        font-size: 1.3rem;
        text-decoration: none;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(10px);
        transition: 0.2s;
      }
      .back-link:active {
        transform: scale(0.9);
        background: rgba(255, 255, 255, 0.3);
      }
      .header-title {
        color: white;
        font-weight: 700;
        letter-spacing: 1px;
        font-size: 1.1rem;
      }

      /* ==========================================
         🎯 SMART SCAN UI (Perfect Centering)
         ========================================== */
      .scan-overlay-ui {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 10;
        pointer-events: none;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      /* 🌟 ប្រើ Box-shadow ដើម្បីបង្កើតរន្ធកណ្តាលយ៉ាងល្អឥតខ្ចោះ */
      .scan-focus-box {
        position: relative;
        width: 250px;
        height: 250px;
        border-radius: 20px;
        box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.5); /* ផ្ទៃងងឹតជុំវិញប្រអប់ */
        margin-bottom: 50px; /* រុញឡើងលើបន្តិចអោយចំកណ្តាលភ្នែកមើល */
      }

      .focus-corner {
        position: absolute;
        width: 40px;
        height: 40px;
        border: 4px solid var(--primary);
        border-radius: 10px;
      }
      .c-tl {
        top: -2px;
        left: -2px;
        border-right: none;
        border-bottom: none;
        border-top-left-radius: 20px;
      }
      .c-tr {
        top: -2px;
        right: -2px;
        border-left: none;
        border-bottom: none;
        border-top-right-radius: 20px;
      }
      .c-bl {
        bottom: -2px;
        left: -2px;
        border-right: none;
        border-top: none;
        border-bottom-left-radius: 20px;
      }
      .c-br {
        bottom: -2px;
        right: -2px;
        border-left: none;
        border-top: none;
        border-bottom-right-radius: 20px;
      }

      .scan-laser {
        position: absolute;
        width: 90%;
        left: 5%;
        height: 2px;
        background: var(--primary);
        box-shadow: 0 0 15px 3px var(--primary);
        animation: smartScan 2s infinite cubic-bezier(0.4, 0, 0.2, 1);
        border-radius: 50%;
      }
      @keyframes smartScan {
        0% {
          top: 10px;
          opacity: 0;
        }
        15% {
          opacity: 1;
        }
        85% {
          opacity: 1;
        }
        100% {
          top: 230px;
          opacity: 0;
        }
      }

      /* 🌟 អក្សរណែនាំដាក់នៅក្រោមប្រអប់ចំកណ្តាលល្អ */
      .scan-text {
        position: absolute;
        bottom: -45px;
        left: 0;
        width: 100%;
        text-align: center;
        color: white;
        font-size: 0.9rem;
        letter-spacing: 0.5px;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
      }

      /* ==========================================
         🎛️ CONTROLS (BOTTOM)
         ========================================== */
      .scan-controls {
        position: absolute;
        bottom: 50px;
        width: 100%;
        z-index: 20;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 30px;
      }
      .control-btn {
        width: 60px;
        height: 60px;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 50%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-size: 1.3rem;
        color: white;
        backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        cursor: pointer;
        transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      }
      .control-btn span {
        font-size: 0.65rem;
        margin-top: 4px;
        font-weight: 600;
        font-family: "Inter", sans-serif;
        opacity: 0.9;
      }
      .control-btn:active {
        transform: scale(0.85);
        background: rgba(255, 255, 255, 0.3);
      }
      .btn-myqr {
        background: var(--primary);
        border: none;
        transform: scale(1.1);
        box-shadow: 0 10px 25px rgba(0, 184, 148, 0.4);
      }
      .btn-myqr:active {
        transform: scale(0.95);
      }

      .premium-swal {
        border-radius: 20px !important;
      }
    </style>
  </head>
  <body>
    <div class="app-container">
      <!-- 🎥 កាមេរ៉ា -->
      <video id="qr-video"></video>

      <div class="scan-header">
        <a href="dashboard.html" class="back-link"
          ><i class="fa-solid fa-chevron-left"></i
        ></a>
        <span class="header-title" data-lang="title_scan">SCAN QR</span>
        <div style="width: 40px"></div>
      </div>

      <!-- 🎯 UI ប្រអប់ស្កេនទំនើប (Perfect Centering) -->
      <div class="scan-overlay-ui">
        <div class="scan-focus-box">
          <div class="focus-corner c-tl"></div>
          <div class="focus-corner c-tr"></div>
          <div class="focus-corner c-bl"></div>
          <div class="focus-corner c-br"></div>
          <div class="scan-laser"></div>
          <div class="scan-text kh-text" data-lang="scan_desc">
            ដាក់កូដ QR ក្នុងប្រអប់ដើម្បីស្កេន
          </div>
        </div>
      </div>

      <!-- 🎛️ ប៊ូតុងបញ្ជា -->
      <div class="scan-controls">
        <div
          class="control-btn"
          onclick="document.getElementById('qr-input-file').click()"
        >
          <i class="fa-regular fa-image"></i><span>Gallery</span>
        </div>
        <div
          class="control-btn btn-myqr"
          onclick="window.location.href = 'qr_code.html'"
        >
          <i class="fa-solid fa-qrcode"></i><span>My QR</span>
        </div>
        <div class="control-btn" id="flashBtn" onclick="toggleFlash()">
          <i class="fa-solid fa-bolt"></i><span>Flash</span>
        </div>
      </div>

      <!-- Input សម្រាប់រើសរូបពី Gallery -->
      <input
        type="file"
        id="qr-input-file"
        accept="image/*"
        style="display: none"
      />
    </div>

    <!-- ⚡️ SCANNER JAVASCRIPT LOGIC ⚡️ -->
    <script>
      let user = JSON.parse(sessionStorage.getItem("user"));
      let token = sessionStorage.getItem("userToken");
      if (!user || !token) window.location.href = "index.html";

      QrScanner.WORKER_PATH =
        "https://unpkg.com/qr-scanner@1.4.2/qr-scanner-worker.min.js";
      let qrScanner = null;
      let isFlashOn = false;

      function applyTheme() {
        const userThemeKey = "theme_" + user.username;
        const isDark = localStorage.getItem(userThemeKey) === "dark";
        if (isDark) document.body.classList.add("dark-mode");
        else document.body.classList.remove("dark-mode");
      }

      window.addEventListener("storage", (event) => {
        if (user && user.username && event.key === "theme_" + user.username)
          applyTheme();
      });

      document.addEventListener("DOMContentLoaded", () => {
        applyTheme();
        if (typeof applyLanguage === "function") applyLanguage();
        document.body.classList.add("loaded");
        startSmartScanner();
      });

      async function startSmartScanner() {
        const videoElem = document.getElementById("qr-video");
        qrScanner = new QrScanner(
          videoElem,
          (result) => handleScanResult(result.data),
          {
            onDecodeError: (error) => {},
            highlightScanRegion: true,
            highlightCodeOutline: true,
            returnDetailedScanResult: true,
          },
        );

        try {
          await qrScanner.start();
          qrScanner.hasCamera().then((hasCamera) => {
            if (hasCamera) {
              const videoTrack = videoElem.srcObject.getVideoTracks()[0];
              const capabilities = videoTrack.getCapabilities();
              if (capabilities.zoom) {
                const targetZoom = Math.min(capabilities.zoom.max, 1.8);
                videoTrack
                  .applyConstraints({ advanced: [{ zoom: targetZoom }] })
                  .catch((e) => {});
              }
            }
          });
        } catch (err) {
          if (!sessionStorage.getItem("cameraErrorShown")) {
            Swal.fire({
              icon: "error",
              title: "មិនអាចបើកកាមេរ៉ាបានទេ!",
              text: "សូមអនុញ្ញាតសិទ្ធិ (Camera Permission) នៅក្នុង Browser របស់អ្នក។",
              confirmButtonColor: "#00b894",
              customClass: { popup: "premium-swal" },
            });
            sessionStorage.setItem("cameraErrorShown", "true");
          }
        }
      }

      function handleScanResult(decodedText) {
        if (qrScanner) qrScanner.stop();
        new Audio(
          "https://notificationsounds.com/storage/sounds/file-sounds-1148-juntos.mp3",
        )
          .play()
          .catch(() => {});

        if (decodedText.startsWith("UFND-")) {
          window.location.href = `transfer.html?acc=${decodedText}&source=qr`;
          return;
        }

        if (decodedText.includes("acc=") || decodedText.startsWith("http")) {
          let queryString = decodedText.includes("?")
            ? decodedText.substring(decodedText.indexOf("?"))
            : "?" + decodedText;
          if (!queryString.includes("source=qr")) queryString += "&source=qr";
          window.location.href = "transfer.html" + queryString;
          return;
        }

        let targetAcc = decodedText;
        let targetAmount = "";
        let lockMoney = false;

        if (decodedText.includes(":")) {
          const parts = decodedText.split(":");
          targetAcc = parts[0];
          targetAmount = parts[1];
          lockMoney = true;
        }

        if (/^\d+$/.test(targetAcc) && targetAcc.length >= 6) {
          let url = `transfer.html?acc=${targetAcc}&source=qr`;
          if (targetAmount) {
            url += `&amount=${targetAmount}`;
            if (lockMoney) url += `&lockAmount=true`;
          }
          window.location.href = url;
        } else {
          Swal.fire({
            icon: "error",
            title: "បរាជ័យ",
            text: "កូដ QR មិនត្រឹមត្រូវឬមិនគាំទ្រ!",
            confirmButtonColor: "#00b894",
            customClass: { popup: "premium-swal" },
          }).then(() => startSmartScanner());
        }
      }

      // 🌟 មុខងារវិភាគរូបភាព (Gallery) ឆ្លាតវៃជាងមុន (AI Image Scan Enhancement)
      const fileInput = document.getElementById("qr-input-file");
      fileInput.addEventListener("change", (event) => {
        const file = event.target.files[0];
        if (!file) return;

        if (qrScanner) qrScanner.stop();
        Swal.fire({
          title: "កំពុងវិភាគ...",
          didOpen: () => Swal.showLoading(),
          customClass: { popup: "premium-swal" },
        });

        // 🌟 បំប្លែងហ្វាល់ទៅជារូបភាព (Image Object) ជាមុនសិន ដើម្បីងាយស្រួលវិភាគ
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            QrScanner.scanImage(img, {
              returnDetailedScanResult: true,
              alsoTryWithoutScanRegion: true, // 🌟 ធ្វើអោយវាឆ្លាត ស្វែងរកកូដគ្រប់កន្លែងក្នុងរូប
            })
              .then((result) => {
                Swal.close();
                handleScanResult(result.data);
              })
              .catch((err) => {
                Swal.close();
                Swal.fire({
                  icon: "error",
                  title: "បរាជ័យ",
                  text: "រកមិនឃើញកូដ QR ពីរូបភាពនេះទេ!",
                  confirmButtonColor: "#00b894",
                  customClass: { popup: "premium-swal" },
                }).then(() => startSmartScanner());
              });
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
        event.target.value = ""; // Reset input
      });

      function toggleFlash() {
        if (!qrScanner) return;
        isFlashOn = !isFlashOn;
        qrScanner.hasFlash().then((hasFlash) => {
          if (hasFlash) {
            isFlashOn ? qrScanner.turnFlashOn() : qrScanner.turnFlashOff();
            const btn = document.getElementById("flashBtn");
            btn.style.background = isFlashOn
              ? "white"
              : "rgba(255, 255, 255, 0.15)";
            btn.style.color = isFlashOn ? "#000" : "white";
          } else {
            Swal.fire({
              icon: "info",
              title: "ទូរស័ព្ទរបស់អ្នកគ្មានភ្លើង Flash ទេ",
              toast: true,
              position: "top",
              timer: 3000,
              showConfirmButton: false,
            });
          }
        });
      }
    </script>
  </body>
</html>

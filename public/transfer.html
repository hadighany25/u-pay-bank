<!-- transfer.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transfer Money - U-Pay</title>
    <link rel="icon" type="image/png" href="images/favicon.png" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Kantumruy+Pro:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/pin.js"></script>
    <!-- 🌟 ប្រើប្រាស់ js/slip.js ដែលមានស្រាប់របស់បងធំ និង js/luckySpin.js -->
    <script src="js/slip.js"></script>
    <script src="js/luckySpin.js"></script>
    <link rel="stylesheet" href="style.css" />

    <style>
      body {
        visibility: hidden;
        opacity: 0;
        background-color: #f1f5f9;
        margin: 0;
        font-family: "Kantumruy Pro", "Inter", sans-serif !important;
        display: flex;
        justify-content: center;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
        transition:
          opacity 0.35s ease,
          background-color 0.3s ease;
      }
      body.loaded {
        visibility: visible;
        opacity: 1;
      }
      *:not(i):not([class*="fa-"]) {
        font-family: "Kantumruy Pro", "Inter", sans-serif !important;
      }
      .fas,
      .fab,
      .far,
      .fa {
        font-family: "Font Awesome 6 Free", "Font Awesome 6 Brands" !important;
        font-weight: 900 !important;
      }
      .app-container {
        width: 100%;
        max-width: 450px;
        background: #ffffff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        position: relative;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
        transition: background-color 0.3s ease;
      }
      .nav-header {
        padding: 18px 20px;
        background: linear-gradient(135deg, #004d40, #00695c);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 1.08rem;
        font-weight: 700;
        box-shadow: 0 4px 15px rgba(0, 77, 64, 0.2);
      }
      .nav-header a {
        color: #fff;
        text-decoration: none;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.15);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.2s;
      }
      .nav-header a:active {
        transform: scale(0.92);
      }
      /* 💱 Mini Airport Ticker Card on Header (Slow & Smooth Wave Animation) */
      .fx-live-pill {
        font-size: 0.72rem;
        background: rgba(15, 23, 42, 0.45);
        padding: 6px 8px;
        border-radius: 12px;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        max-width: 240px;
        height: 38px;
        overflow: hidden;
        box-sizing: border-box;
        perspective: 1000px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      }
      .fx-mini-card-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        width: 100%;
        white-space: nowrap;
        /* 🌟 កែរយះពេលពី 0.38s ទៅ 0.6s ឱ្យវាយឺតស្អាត និងទន់ភ្លន់ */
        animation: fxMiniCardFadeIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      @keyframes fxMiniCardFadeIn {
        0% {
          opacity: 0;
          transform: rotateX(60deg) translateY(8px);
        }
        100% {
          opacity: 1;
          transform: rotateX(0deg) translateY(0);
        }
      }
      .afx-flag-pair {
        position: relative;
        width: 34px;
        height: 24px;
        flex-shrink: 0;
      }
      .afx-flag-img-1 {
        width: 21px;
        height: 15px;
        border-radius: 2px;
        object-fit: cover;
        position: absolute;
        top: 0;
        left: 0;
        border: 1px solid rgba(255, 255, 255, 0.5);
      }
      .afx-flag-img-2 {
        width: 19px;
        height: 13px;
        border-radius: 2px;
        object-fit: cover;
        position: absolute;
        bottom: 0;
        right: 0;
        border: 1px solid #0f172a;
      }

      .afx-ticker-card {
        width: 100% !important;
        box-sizing: border-box !important;
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        padding: 10px 12px; /* កាត់បន្ថយ Padding បន្តិចដើម្បីឱ្យដាក់ត្រូវ ៤ កាតពេញទទឹងស្អាតរលោង */
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        backface-visibility: hidden;
        transform-origin: center center;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
        transition:
          border-color 0.3s ease,
          box-shadow 0.3s ease;
      }
      .transfer-form {
        padding: 16px 20px 30px;
        flex: 1;
      }
      .section-label {
        font-size: 0.8rem;
        color: #64748b;
        font-weight: 800;
        text-transform: uppercase;
        margin-bottom: 10px;
        letter-spacing: 0.5px;
      }

      /* Recent Contacts */
      .recent-contacts-container {
        margin-bottom: 10px;
        display: none;
      }
      .contacts-scroll {
        display: flex;
        gap: 14px;
        overflow-x: auto;
        padding: 6px 4px 10px;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }
      .contacts-scroll::-webkit-scrollbar {
        display: none;
      }
      .contact-item {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        cursor: pointer;
        transition: transform 0.25s ease;
        min-width: 64px;
        flex-shrink: 0;
      }
      .contact-item:hover {
        transform: translateY(-5px);
      }
      .contact-avatar {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 1.1rem;
        font-weight: 800;
        position: relative;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
        border: 2px solid white;
      }
      .delete-btn {
        position: absolute;
        top: -2px;
        right: -2px;
        background-color: #ef4444;
        color: white;
        width: 19px;
        height: 19px;
        border-radius: 50%;
        font-size: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
        opacity: 0;
        transition: 0.2s;
        z-index: 10;
      }
      .contact-item:hover .delete-btn {
        opacity: 1;
      }
      .contact-info {
        margin-top: 6px;
        text-align: center;
        min-height: 32px;
        width: 100%;
      }
      .short-name {
        font-size: 0.72rem;
        font-weight: 700;
        color: #334155;
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .full-details {
        display: none;
        font-size: 0.65rem;
        color: #64748b;
        white-space: nowrap;
      }
      .full-details .f-name {
        font-weight: 800;
        color: #006039;
      }
      .contact-item:hover .short-name {
        display: none;
      }
      .contact-item:hover .full-details {
        display: block;
      }

      /* Receiver Profile Card */
      .receiver-box {
        text-align: center;
        margin-bottom: 18px;
        padding: 18px 16px;
        background: #f8fafc;
        border-radius: 20px;
        border: 1.5px dashed #cbd5e1;
        transition: all 0.3s ease;
      }
      .receiver-icon {
        width: 64px;
        height: 64px;
        background: #e0f2f1;
        border-radius: 50%;
        margin: 0 auto 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #004d40;
        font-size: 1.55rem;
        overflow: hidden;
        box-shadow: 0 4px 12px rgba(0, 77, 64, 0.12);
        border: 2.5px solid #ffffff;
      }
      .receiver-cur-badge {
        display: none;
        margin-top: 6px;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 0.74rem;
        font-weight: 800;
        background: rgba(16, 185, 129, 0.14);
        color: #059669;
        align-items: center;
        gap: 6px;
      }

      /* Form Inputs */
      .input-group {
        margin-bottom: 15px;
        position: relative;
      }
      .input-group label {
        font-weight: 700;
        font-size: 0.85rem;
        color: #475569;
        margin-bottom: 7px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .main-input {
        width: 100%;
        padding: 14px 15px;
        border: 1.5px solid #cbd5e1;
        border-radius: 14px;
        font-size: 0.98rem;
        font-weight: 700;
        color: #0f172a;
        outline: none;
        background: #fff;
        box-sizing: border-box;
        transition: 0.25s;
      }
      .main-input:focus {
        border-color: #004d40;
        box-shadow: 0 0 0 3px rgba(0, 77, 64, 0.1);
      }
      .main-input[readonly] {
        background-color: #f1f5f9;
        color: #64748b;
        cursor: not-allowed;
      }
      .check-status {
        position: absolute;
        right: 15px;
        top: 41px;
        font-size: 0.95rem;
        font-weight: bold;
      }
      .status-ok {
        color: #10b981;
      }
      .status-err {
        color: #ef4444;
      }
      .status-loading {
        color: #f59e0b;
      }

      /* 💱 Currency Switcher Pills (អាចដូររូបិយប័ណ្ណបាញ់ USD ឬ KHR ដោយសេរី) */
      .curr-toggle-group {
        display: inline-flex;
        background: #e2e8f0;
        padding: 3px;
        border-radius: 10px;
        gap: 3px;
      }
      .curr-toggle-btn {
        border: none;
        background: transparent;
        color: #475569;
        font-size: 0.74rem;
        font-weight: 800;
        padding: 4px 10px;
        border-radius: 7px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        transition: 0.2s;
      }
      .curr-toggle-btn.active {
        background: #004d40;
        color: #ffffff;
        box-shadow: 0 2px 6px rgba(0, 77, 64, 0.2);
      }

      /* Quick Amount Chips */
      .quick-amt-row {
        display: flex;
        gap: 7px;
        overflow-x: auto;
        scrollbar-width: none;
        margin-top: -6px;
        margin-bottom: 14px;
        padding: 2px 0;
        transition: opacity 0.2s ease;
      }
      .quick-amt-row::-webkit-scrollbar {
        display: none;
      }
      .quick-amt-chip {
        padding: 6px 13px;
        border-radius: 10px;
        border: 1px solid #cbd5e1;
        background: #f8fafc;
        color: #0f172a;
        font-size: 0.78rem;
        font-weight: 800;
        cursor: pointer;
        white-space: nowrap;
        transition: 0.2s;
      }
      .quick-amt-chip:hover,
      .quick-amt-chip:active {
        background: #004d40;
        color: #ffffff;
        border-color: #004d40;
      }

      /* 💱 Smart FX & Fee Breakdown Card */
      .fx-smart-card {
        background: linear-gradient(
          135deg,
          rgba(240, 253, 244, 0.95),
          rgba(236, 253, 245, 0.95)
        );
        border: 1.5px solid #86efac;
        border-radius: 16px;
        padding: 14px 16px;
        margin-bottom: 16px;
        display: none;
        animation: fadeIn 0.25s ease;
      }
      .fx-smart-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 8px;
        margin-bottom: 8px;
        border-bottom: 1px dashed #bbf7d0;
        font-size: 0.78rem;
        font-weight: 800;
        color: #065f46;
      }
      .fx-smart-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.84rem;
        margin-bottom: 6px;
        color: #166534;
      }
      .fx-smart-row:last-child {
        margin-bottom: 0;
        padding-top: 6px;
        border-top: 1px solid rgba(22, 101, 52, 0.12);
      }

      .confirm-btn {
        width: 100%;
        padding: 16px;
        background: linear-gradient(135deg, #004d40, #0d9488);
        color: #fff;
        border: none;
        border-radius: 16px;
        font-size: 1.05rem;
        font-weight: 800;
        cursor: pointer;
        margin-top: 8px;
        box-shadow: 0 8px 20px rgba(0, 77, 64, 0.22);
        transition: 0.25s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .confirm-btn:active {
        transform: scale(0.98);
      }
      .confirm-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }

      /* DARK MODE */
      body.dark-mode {
        background-color: #0f172a !important;
        color: #f8fafc !important;
      }
      body.dark-mode .app-container {
        background-color: #0f172a !important;
      }
      body.dark-mode .nav-header {
        background: #1e293b !important;
        border-bottom: 1px solid #334155;
      }
      body.dark-mode .receiver-box {
        background-color: #1e293b !important;
        border-color: #334155;
      }
      body.dark-mode .main-input {
        background: #1e293b !important;
        color: #f8fafc !important;
        border-color: #334155;
      }
      body.dark-mode .input-group label,
      body.dark-mode .section-label,
      body.dark-mode .short-name {
        color: #cbd5e1;
      }
      body.dark-mode .curr-toggle-group {
        background: #1e293b;
        border: 1px solid #334155;
      }
      body.dark-mode .curr-toggle-btn {
        color: #94a3b8;
      }
      body.dark-mode .curr-toggle-btn.active {
        background: #10b981;
        color: #0f172a;
      }
      body.dark-mode .quick-amt-chip {
        background: #1e293b;
        color: #e2e8f0;
        border-color: #334155;
      }
      body.dark-mode .fx-smart-card {
        background: rgba(16, 185, 129, 0.1);
        border-color: rgba(16, 185, 129, 0.35);
      }
      body.dark-mode .fx-smart-header,
      body.dark-mode .fx-smart-row {
        color: #a7f3d0;
      }
    </style>
  </head>
  <body>
    <div class="app-container">
      <!-- ក្បាលទំព័រ + ផ្លាកអត្រាប្តូរប្រាក់មានរូបទង់ជាតិច្បាស់ៗ -->
      <div class="nav-header">
        <div style="display: flex; align-items: center; gap: 12px">
          <a href="dashboard.html" id="topBackBtn"
            ><i class="fa-solid fa-arrow-left"></i
          ></a>
          <span data-lang="title_transfer">ផ្ទេរប្រាក់ (Transfer)</span>
        </div>
        <div
          class="fx-live-pill"
          id="headerFxBadge"
          onclick="window.location.href = 'exchange-rates.html'"
          style="cursor: pointer"
          title="ចុចដើម្បីមើលតារាងអត្រាប្តូរប្រាក់ និងគណនាលុយ"
        ></div>
      </div>

      <div class="transfer-form">
        <!-- RECENT CONTACTS -->
        <div class="recent-contacts-container" id="recentContactsBlock">
          <p class="section-label" data-lang="recent_contacts">
            គណនីធ្លាប់វេរថ្មីៗ (Recent Contacts)
          </p>
          <div class="contacts-scroll" id="contactsList"></div>
        </div>

        <!-- ប្រអប់បង្ហាញឈ្មោះ និងរូប Profile ពិតរបស់អ្នកទទួល -->
        <div class="receiver-box" id="receiverBoxUI">
          <div class="receiver-icon" id="receiverIconUI">
            <i class="fa-solid fa-user"></i>
          </div>
          <h3
            id="displayReceiverName"
            style="
              margin: 0;
              color: #004d40;
              min-height: 24px;
              font-size: 1.08rem;
            "
          >
            ...
          </h3>
          <p
            style="margin: 4px 0 0; color: #64748b; font-size: 0.82rem"
            data-lang="receiver_label"
          >
            អ្នកទទួលប្រាក់ (Receiver)
          </p>
          <div id="receiverCurBadge" class="receiver-cur-badge"></div>
        </div>

        <!-- ១. ជ្រើសរើសគណនីប្រភព (អាចដូរពីកុងខ្មែរទៅដុល្លារ ឬដុល្លារទៅខ្មែរបានសេរី) -->
        <div class="input-group">
          <label>
            <span data-lang="source_account">គណនីប្រភព (Source Account)</span>
            <span
              id="availableBalance"
              style="color: #10b981; font-size: 0.82rem; font-weight: 800"
            ></span>
          </label>
          <select
            id="fromAccount"
            class="main-input"
            onchange="onSourceAccountChanged()"
          ></select>
        </div>

        <!-- ២. លេខគណនីអ្នកទទួល -->
        <div class="input-group">
          <label data-lang="receiver_acc"
            >លេខគណនីអ្នកទទួល (Receiver Account)</label
          >
          <input
            type="text"
            id="receiverAcc"
            class="main-input"
            placeholder="បញ្ចូលលេខគណនីអ្នកទទួល..."
            style="text-transform: uppercase"
            oninput="debounceCheckName()"
          />
          <span id="nameCheck" class="check-status"></span>
        </div>

        <!-- 🌟 ប្រអប់ Bailout សម្រាប់ U-Fund -->
        <div class="input-group" id="bailoutGroup" style="display: none">
          <label style="color: #0284c7">គោលបំណងបង់ប្រាក់ / ជួសអ្នកណា?</label>
          <select
            id="bailoutTarget"
            class="main-input"
            style="
              border-color: #bae6fd;
              background: #f0f9ff;
              color: #0369a1;
              font-weight: bold;
            "
          >
            <option value="">👤 បង់ប្រាក់ចូលគណនីខ្លួនឯង (Advance)</option>
          </select>
        </div>

        <!-- ៣. ចំនួនទឹកប្រាក់ + ប៊ូតុងប្តូររូបិយប័ណ្ណបាញ់សេរី (USD $ ⇄ KHR ៛) -->
        <div class="input-group">
          <label>
            <span data-lang="amount_label"
              >ចំនួនទឹកប្រាក់ចង់ផ្ទេរ (Amount)</span
            >
            <!-- ប៊ូតុងឱ្យអតិថិជនជ្រើសរើសបាញ់ជាដុល្លារ ឬរៀលបានតាមចិត្ត ទោះកុងខ្លួនឯងជាដុល្លារ ឬរៀលក៏ដោយ -->
            <div class="curr-toggle-group">
              <button
                type="button"
                id="btnEnterUSD"
                class="curr-toggle-btn active"
                onclick="setTransferInputCurrency('USD')"
              >
                <img src="https://flagcdn.com/w20/us.png" class="flag-mini" />
                USD ($)
              </button>
              <button
                type="button"
                id="btnEnterKHR"
                class="curr-toggle-btn"
                onclick="setTransferInputCurrency('KHR')"
              >
                <img src="https://flagcdn.com/w20/kh.png" class="flag-mini" />
                KHR (៛)
              </button>
            </div>
          </label>
          <input
            type="number"
            id="amount"
            class="main-input"
            placeholder="0.00"
            step="any"
            oninput="onAmountTyped()"
          />
        </div>

        <!-- ប៊ូតុងជ្រើសរើសទឹកប្រាក់រហ័ស (លាក់ខ្លួនអូតូពេលវាយលេខចូល) -->
        <div class="quick-amt-row" id="quickAmountChips"></div>

        <!-- 💱 ប្រអប់បង្ហាញអត្រាប្តូរប្រាក់ (មានទង់ជាតិច្បាស់ៗ) និងថ្លៃសេវាពណ៌ក្រហម -->
        <div id="exchangePreview" class="fx-smart-card">
          <div class="fx-smart-header">
            <span
              id="fxFlowLabel"
              style="display: inline-flex; align-items: center; gap: 6px"
            ></span>
            <span id="fxRateDisplay">អត្រា៖ $1 = 4,050 ៛</span>
          </div>
          <div class="fx-smart-row">
            <span>ប្រាក់ដើមត្រូវកាត់ពីគណនីរបស់អ្នក:</span>
            <strong id="fxPrincipalDeductDisplay">$0.00</strong>
          </div>
          <div class="fx-smart-row">
            <span>ថ្លៃសេវាផ្ទេរប្រាក់ (Transfer Fee):</span>
            <!-- 🔴 ដាក់ពណ៌ក្រហមសម្រាប់ថ្លៃសេវាតាមសំណូមពរ -->
            <strong id="fxFeeDisplay" style="color: #ef4444">$0.00</strong>
          </div>
          <div class="fx-smart-row">
            <span>សរុបត្រូវកាត់ពីគណនីរបស់អ្នក:</span>
            <strong id="fxTotalDeductDisplay">$0.00</strong>
          </div>
          <div class="fx-smart-row">
            <span data-lang="receiver_gets">អ្នកទទួលនឹងទទួលបានពិតប្រាកដ:</span>
            <strong
              id="fxResultDisplay"
              style="font-size: 1.05rem; color: #059669"
              >...</strong
            >
          </div>
        </div>

        <!-- ៤. ចំណាំ -->
        <div class="input-group">
          <label data-lang="remark">ចំណាំ (Remark)</label>
          <input
            type="text"
            id="remark"
            class="main-input"
            placeholder="បញ្ជាក់ចំណាំ (មិនដាក់ក៏បាន)..."
          />
        </div>

        <button
          type="button"
          id="btnSubmitTransfer"
          onclick="validateAndOpenPin()"
          class="confirm-btn"
          data-lang="btn_transfer_now"
        >
          <i class="fa-solid fa-paper-plane"></i>
          <span>បញ្ជូនប្រាក់ឥឡូវនេះ (Transfer Now)</span>
        </button>
      </div>
    </div>

    <script>
      const uPayUserString = sessionStorage.getItem("user");
      const token = sessionStorage.getItem("userToken");
      if (!uPayUserString || !token)
        window.location.href = "index.html" + window.location.search;

      const user = JSON.parse(uPayUserString);
      const authHeaders = {
        "Content-Type": "application/json",
        Authorization: `Bearer ${token}`,
      };

      const urlParamsGlobal = new URLSearchParams(window.location.search);
      const orderId =
        urlParamsGlobal.get("orderId") || urlParamsGlobal.get("o");
      const callbackUrl = urlParamsGlobal.get("callback");
      const items = urlParamsGlobal.get("items");
      const shopBuyerName = urlParamsGlobal.get("user");

      let targetUserIsKHR = null;
      let currentFXRates = { usdToKhrBuy: 4050, usdToKhrSell: 4100 };
      let currentFeeTiers = [];
      let systemDailyLimitUSD = 5000;
      let selectedInputCurrency = "USD"; // អាចដូររវាង USD និង KHR ដោយសេរី
      let isTransactionCommitted = false; // 🔒 ការពារមិនឱ្យចុច Back ក្រោយវាយ PIN ត្រូវ

      // 🔒 ប្លុកប៊ូតុង Back របស់ Browser នៅពេលប្រតិបត្តិការបានវាយ PIN ត្រូវរួចហើយ
      window.addEventListener("popstate", function () {
        if (isTransactionCommitted) {
          history.pushState(null, null, location.href);
        }
      });

      function flagImgHtml(code) {
        return `<img src="https://flagcdn.com/w20/${code.toLowerCase()}.png" class="flag-mini" alt="${code}">`;
      }

      window.addEventListener("DOMContentLoaded", async () => {
        applyTheme();
        document.body.classList.add("loaded");
        populateSourceAccounts();

        // 🌟 ១. បង្ហាញកាតអត្រាប្តូរប្រាក់ដូចរូបទី ២ ភ្លាមៗតាំងពីវិនាទីដំបូង!
        updateHeaderFxBadge();

        // 🌟 ២. ទាញអត្រាប្តូរប្រាក់ពិតរបស់ Admin ពី Server មកអាប់ដេតភ្លាមៗ
        try {
          const sampleAcc =
            user.mainAccounts?.USD?.accountNumber ||
            user.accountNumber ||
            "888888888";
          const fxRes = await fetch("/api/check-account", {
            method: "POST",
            headers: authHeaders,
            body: JSON.stringify({ accountNumber: sampleAcc }),
          });
          const fxData = await fxRes.json();
          if (fxData && fxData.fxRates) {
            currentFXRates = fxData.fxRates;
            if (Array.isArray(fxData.feeTiers)) {
              currentFeeTiers = fxData.feeTiers;
            }
            if (fxData.transferLimit) {
              systemDailyLimitUSD = parseFloat(fxData.transferLimit) || 5000;
            }
            updateHeaderFxBadge();
          }
        } catch (e) {}

        const urlParams = new URLSearchParams(window.location.search);

        if (urlParams.get("acc")) {
          let rawAcc = urlParams.get("acc");
          let parts = rawAcc.split(":");

          let ai = document.getElementById("receiverAcc");
          ai.value = parts[0];
          ai.readOnly = true;

          if (
            parts[1] &&
            parseFloat(parts[1]) > 0 &&
            !urlParams.get("amount") &&
            !urlParams.get("a")
          ) {
            document.getElementById("amount").value = parts[1];
          }

          await checkName();
        }

        let passedAmount = urlParams.get("amount") || urlParams.get("a");
        if (passedAmount) {
          let amti = document.getElementById("amount");
          amti.value = passedAmount;
          if (urlParams.get("lockAmount") === "true" || urlParams.has("a")) {
            amti.readOnly = true;
          }
          toggleQuickChipsVisibility();
        }

        loadRecentContacts();

        const origCloseSlip = window.closeSlipGlobal;
        window.closeSlipGlobal = function () {
          if (typeof origCloseSlip === "function") origCloseSlip();
          returnToShopOrDashboard();
        };
      });

      let miniFxIndex = 0;
      let miniFxTimer = null;

      function updateHeaderFxBadge() {
        const badge = document.getElementById("headerFxBadge");
        if (!badge) return;

        let list = [
          {
            code: "USD/KHR",
            c1: "us",
            c2: "kh",
            buy: Number(currentFXRates?.usdToKhrBuy || 4050).toLocaleString(),
            sell: Number(currentFXRates?.usdToKhrSell || 4100).toLocaleString(),
            quote: "៛",
            change: "+0.10%",
            trend: "up",
          },
          {
            code: "THB/KHR",
            c1: "th",
            c2: "kh",
            buy: "118.5",
            sell: "121.0",
            quote: "៛",
            change: "+0.30%",
            trend: "up",
          },
          {
            code: "CNY/KHR",
            c1: "cn",
            c2: "kh",
            buy: "562.0",
            sell: "575.0",
            quote: "៛",
            change: "+0.20%",
            trend: "up",
          },
          {
            code: "EUR/KHR",
            c1: "eu",
            c2: "kh",
            buy: "4,380",
            sell: "4,460",
            quote: "៛",
            change: "+0.07%",
            trend: "up",
          },
          {
            code: "SGD/KHR",
            c1: "sg",
            c2: "kh",
            buy: "3,141",
            sell: "3,191",
            quote: "៛",
            change: "+0.15%",
            trend: "up",
          },
          {
            code: "VND/KHR",
            c1: "vn",
            c2: "kh",
            buy: "154.67",
            sell: "159.38",
            quote: "៛",
            change: "-0.05%",
            trend: "down",
          },
          {
            code: "AUD/KHR",
            c1: "au",
            c2: "kh",
            buy: "2,680",
            sell: "2,740",
            quote: "៛",
            change: "+0.20%",
            trend: "up",
          },
          {
            code: "JPY/KHR",
            c1: "jp",
            c2: "kh",
            buy: "2,543",
            sell: "2,594",
            quote: "៛",
            change: "-0.12%",
            trend: "down",
          },
        ];

        // ចាប់យកតារាងរូបិយប័ណ្ណទាំង ៨ ពី currentFXRates.multiCurrencies របស់ Admin បើមាន
        if (
          currentFXRates &&
          Array.isArray(currentFXRates.multiCurrencies) &&
          currentFXRates.multiCurrencies.length >= 4
        ) {
          list = currentFXRates.multiCurrencies.map((item, idx) => ({
            code: item.code || "USD/KHR",
            c1: item.c1 || "us",
            c2: item.c2 || "kh",
            buy: Number(
              idx === 0 ? currentFXRates.usdToKhrBuy : item.buy,
            ).toLocaleString(),
            sell: Number(
              idx === 0 ? currentFXRates.usdToKhrSell : item.sell,
            ).toLocaleString(),
            quote: item.quote || "៛",
            change: item.change || "+0.10%",
            trend: item.trend || "up",
          }));
        }

        const renderCurrentCard = () => {
          const item = list[miniFxIndex % list.length];
          const isUp = item.trend !== "down";
          const trendColor = isUp ? "#34d399" : "#f87171";
          const trendBg = isUp
            ? "rgba(16, 185, 129, 0.2)"
            : "rgba(239, 68, 68, 0.2)";
          const trendIcon = isUp ? "fa-caret-up" : "fa-caret-down";

          badge.innerHTML = `
            <div class="fx-mini-card-inner">
              <div style="display: flex; align-items: center; gap: 6px;">
                <div class="afx-flag-pair">
                  <img src="https://flagcdn.com/w40/${item.c1}.png" class="afx-flag-img-1" />
                  <img src="https://flagcdn.com/w40/${item.c2}.png" class="afx-flag-img-2" />
                </div>
                <div>
                  <div style="font-size: 0.76rem; font-weight: 900; color: #f8fafc; line-height: 1.1;">${item.code}</div>
                  <div style="font-size: 0.65rem; font-weight: 700; color: #cbd5e1; margin-top: 1px;">
                    ទិញ: <b style="color:#34d399;">${item.buy}</b> លក់: <b style="color:#60a5fa;">${item.sell}${item.quote}</b>
                  </div>
                </div>
              </div>
              <span style="font-size: 0.68rem; font-weight: 800; color: ${trendColor}; background: ${trendBg}; padding: 2px 6px; border-radius: 6px; white-space: nowrap;">
                <i class="fa-solid ${trendIcon}"></i> ${item.change}
              </span>
            </div>
          `;
          miniFxIndex = (miniFxIndex + 1) % list.length;
        };

        renderCurrentCard();
        if (miniFxTimer) clearInterval(miniFxTimer);
        miniFxTimer = setInterval(renderCurrentCard, 4500);
      }

      function applyTheme() {
        const userThemeKey = "theme_" + user.username;
        const isDark = localStorage.getItem(userThemeKey) === "dark";
        if (isDark) document.body.classList.add("dark-mode");
        else document.body.classList.remove("dark-mode");
      }

      window.addEventListener("storage", (event) => {
        if (user && user.username) {
          const userThemeKey = "theme_" + user.username;
          if (event.key === userThemeKey) applyTheme();
        }
      });

      function populateSourceAccounts() {
        const select = document.getElementById("fromAccount");
        const prevVal = select.value;
        select.innerHTML = "";
        let lang = localStorage.getItem("lang") || "en";

        if (
          user.mainAccounts &&
          user.mainAccounts.USD &&
          user.mainAccounts.USD.accountNumber
        ) {
          const usdOpt = document.createElement("option");
          usdOpt.value = user.mainAccounts.USD.accountNumber;
          usdOpt.dataset.currency = "USD";
          usdOpt.dataset.balance = user.mainAccounts.USD.balance || 0;
          usdOpt.dataset.dailyLimit = user.mainAccounts.USD.dailyLimit || 0;
          usdOpt.text =
            (lang === "kh" ? "គណនីចម្បង ($) - " : "Main Account ($) - ") +
            user.mainAccounts.USD.accountNumber;
          select.appendChild(usdOpt);
        } else if (user.accountNumber) {
          const usdOpt = document.createElement("option");
          usdOpt.value = "MAIN_USD";
          usdOpt.dataset.currency = "USD";
          usdOpt.dataset.balance = user.balance || 0;
          usdOpt.text =
            (lang === "kh" ? "គណនីចម្បង ($) - " : "Main Account ($) - ") +
            user.accountNumber;
          select.appendChild(usdOpt);
        }

        if (
          user.mainAccounts &&
          user.mainAccounts.KHR &&
          user.mainAccounts.KHR.accountNumber
        ) {
          const khrOpt = document.createElement("option");
          khrOpt.value = user.mainAccounts.KHR.accountNumber;
          khrOpt.dataset.currency = "KHR";
          khrOpt.dataset.balance = user.mainAccounts.KHR.balance || 0;
          khrOpt.dataset.dailyLimit = user.mainAccounts.KHR.dailyLimit || 0;
          khrOpt.text =
            (lang === "kh" ? "គណនីចម្បង (៛) - " : "Main Account (៛) - ") +
            user.mainAccounts.KHR.accountNumber;
          select.appendChild(khrOpt);
        } else if (user.accountNumberKHR) {
          const khrOpt = document.createElement("option");
          khrOpt.value = "MAIN_KHR";
          khrOpt.dataset.currency = "KHR";
          khrOpt.dataset.balance = user.balanceKHR || 0;
          khrOpt.text =
            (lang === "kh" ? "គណនីចម្បង (៛) - " : "Main Account (៛) - ") +
            user.accountNumberKHR;
          select.appendChild(khrOpt);
        }

        if (user.subAccounts && user.subAccounts.length > 0) {
          user.subAccounts.forEach((sub) => {
            if (sub.isHidden) return;
            const opt = document.createElement("option");
            opt.value = sub.accountNumber;
            opt.dataset.currency = sub.currency;
            opt.dataset.balance = sub.balance || 0;
            opt.dataset.dailyLimit = sub.dailyLimit || 0;
            opt.text = `${sub.accountName} (${sub.currency === "USD" ? "$" : "៛"}) - ${sub.accountNumber}`;
            select.appendChild(opt);
          });
        }

        if (
          prevVal &&
          Array.from(select.options).some((o) => o.value === prevVal)
        ) {
          select.value = prevVal;
        }

        onSourceAccountChanged();
      }

      // ពេលប្តូរគណនីប្រភព
      window.onSourceAccountChanged = function () {
        const select = document.getElementById("fromAccount");
        if (select.options.length === 0) return;
        const opt = select.options[select.selectedIndex];
        const accCur = opt.dataset.currency || "USD";
        const bal = parseFloat(opt.dataset.balance || 0);
        const sign = accCur === "USD" ? "$" : "៛";

        document.getElementById("availableBalance").innerText =
          accCur === "USD"
            ? `សមតុល្យ៖ ${sign}${bal.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`
            : `សមតុល្យ៖ ${bal.toLocaleString("en-US")} ${sign}`;

        // បើមិនទាន់បានវាយលុយទេ ឱ្យរូបិយប័ណ្ណបាញ់រត់តាមរូបិយប័ណ្ណគណនីប្រភពសិន
        const currentAmtVal = document.getElementById("amount").value.trim();
        if (!currentAmtVal) {
          setTransferInputCurrency(accCur, false);
        } else {
          calculateExchangePreview();
        }
      };

      // 🔄 មុខងារប្តូររូបិយប័ណ្ណទឹកប្រាក់ដែលចង់បាញ់ (USD ⇄ KHR) ព្រមទាំងបំប្លែងលេខក្នុងប្រអប់ឱ្យអូតូ!
      window.setTransferInputCurrency = function (
        newCur,
        convertExisting = true,
      ) {
        const prevCur = selectedInputCurrency;
        selectedInputCurrency = newCur;

        document
          .getElementById("btnEnterUSD")
          ?.classList.toggle("active", newCur === "USD");
        document
          .getElementById("btnEnterKHR")
          ?.classList.toggle("active", newCur === "KHR");

        const amtInput = document.getElementById("amount");
        if (
          convertExisting &&
          prevCur !== newCur &&
          amtInput &&
          !amtInput.readOnly
        ) {
          const curVal = parseFloat(amtInput.value) || 0;
          if (curVal > 0) {
            const buyRate = parseFloat(currentFXRates?.usdToKhrBuy) || 4050;
            const sellRate = parseFloat(currentFXRates?.usdToKhrSell) || 4100;
            if (prevCur === "USD" && newCur === "KHR") {
              amtInput.value = Math.round(curVal * buyRate);
            } else if (prevCur === "KHR" && newCur === "USD") {
              amtInput.value = (curVal / sellRate).toFixed(2);
            }
          }
        }

        if (amtInput) {
          amtInput.placeholder = newCur === "KHR" ? "0 ៛" : "0.00 $";
        }

        renderQuickAmountChips(newCur);
        toggleQuickChipsVisibility();
        calculateExchangePreview();
      };

      function renderQuickAmountChips(currency) {
        const container = document.getElementById("quickAmountChips");
        if (!container) return;

        const presets =
          currency === "KHR"
            ? [
                { label: "10,000 ៛", val: 10000 },
                { label: "20,000 ៛", val: 20000 },
                { label: "50,000 ៛", val: 50000 },
                { label: "100,000 ៛", val: 100000 },
                { label: "200,000 ៛", val: 200000 },
              ]
            : [
                { label: "$5", val: 5 },
                { label: "$10", val: 10 },
                { label: "$20", val: 20 },
                { label: "$50", val: 50 },
                { label: "$100", val: 100 },
              ];

        container.innerHTML = presets
          .map(
            (p) =>
              `<button type="button" class="quick-amt-chip" onclick="setQuickTransferAmount(${p.val})">${p.label}</button>`,
          )
          .join("");
      }

      // ⚡ បើគេវាយលេខចូលហើយ ឱ្យប៊ូតុងជ្រើសរើសលឿន ($5 $10 $20...) លាក់ខ្លួនបាត់អូតូ!
      function toggleQuickChipsVisibility() {
        const container = document.getElementById("quickAmountChips");
        const amtInput = document.getElementById("amount");
        if (!container || !amtInput) return;

        if (amtInput.readOnly || amtInput.value.trim() !== "") {
          container.style.display = "none";
        } else {
          container.style.display = "flex";
        }
      }

      window.onAmountTyped = function () {
        toggleQuickChipsVisibility();
        calculateExchangePreview();
      };

      window.setQuickTransferAmount = function (val) {
        const amtInput = document.getElementById("amount");
        if (amtInput && !amtInput.readOnly) {
          amtInput.value = val;
          toggleQuickChipsVisibility();
          calculateExchangePreview();
        }
      };

      // 🗂️ កូនសោរក្សាទុកបញ្ជីគណនីដែល User បានចុច ✖ លុបចេញពី Recent Contacts
      const hiddenContactsStorageKey = `hiddenRecentContacts_${user.username}`;

      function getHiddenRecentContacts() {
        try {
          return (
            JSON.parse(localStorage.getItem(hiddenContactsStorageKey)) || []
          );
        } catch (e) {
          return [];
        }
      }

      function loadRecentContacts() {
        if (!user.transactions || user.transactions.length === 0) return;
        const hiddenAccs = new Set(getHiddenRecentContacts());
        let contacts = [];
        let seenAccounts = new Set();

        for (let t of user.transactions) {
          if (
            t.amount < 0 &&
            t.receiverAcc &&
            t.receiverAcc !== "888000999" &&
            t.receiverAcc !== "777888999" &&
            t.type !== "Transfer Fee" &&
            !hiddenAccs.has(String(t.receiverAcc))
          ) {
            let recName = t.receiverName || t.partner || "Unknown";
            if (
              recName.toLowerCase() !== "unknown" &&
              !seenAccounts.has(t.receiverAcc)
            ) {
              seenAccounts.add(t.receiverAcc);
              contacts.push({ name: recName, acc: t.receiverAcc });
            }
          }
        }

        const container = document.getElementById("recentContactsBlock");
        const list = document.getElementById("contactsList");
        if (contacts.length === 0) {
          container.style.display = "none";
          return;
        }

        container.style.display = "block";
        list.innerHTML = "";
        const colors = [
          "#f43f5e",
          "#f97316",
          "#eab308",
          "#84cc16",
          "#10b981",
          "#06b6d4",
          "#0ea5e9",
          "#3b82f6",
          "#8b5cf6",
          "#d946ef",
          "#f472b6",
        ];

        contacts.slice(0, 10).forEach((c, index) => {
          const bgColor = colors[index % colors.length];
          const initials = c.name.substring(0, 2).toUpperCase();
          const shortName = c.name.split(" ")[0];

          list.innerHTML += `
          <div class="contact-item" onclick="selectContact('${c.acc}')">
            <div class="contact-avatar" style="background-color: ${bgColor};">
              ${initials}
              <div class="delete-btn" onclick="removeContact(event, '${c.acc}', this)">✖</div>
            </div>
            <div class="contact-info">
              <span class="short-name">${shortName}</span>
              <div class="full-details"><div class="f-name">${c.name}</div><div class="acc-num">${c.acc}</div></div>
            </div>
          </div>`;
        });
      }

      function removeContact(event, accountNumber, element) {
        event.stopPropagation();

        // 💾 កត់ត្រាលេខគណនីដែលបានលុបចូលក្នុង localStorage ដើម្បីកុំឱ្យលោតមកវិញពេល Refresh!
        const currentHidden = getHiddenRecentContacts();
        const accStr = String(accountNumber);
        if (!currentHidden.includes(accStr)) {
          currentHidden.push(accStr);
          localStorage.setItem(
            hiddenContactsStorageKey,
            JSON.stringify(currentHidden),
          );
        }

        const contactItem = element.closest(".contact-item");
        if (contactItem) {
          contactItem.style.opacity = "0";
          contactItem.style.transform = "scale(0.8)";
          setTimeout(() => {
            contactItem.remove();
            const list = document.getElementById("contactsList");
            if (list && list.children.length === 0) {
              document.getElementById("recentContactsBlock").style.display =
                "none";
            }
          }, 200);
        }
      }

      function selectContact(acc) {
        const input = document.getElementById("receiverAcc");
        if (!input.readOnly) {
          input.value = acc;
          checkName();
        }
      }

      let typingTimer;
      function debounceCheckName() {
        clearTimeout(typingTimer);
        const accInput = document.getElementById("receiverAcc").value.trim();
        const status = document.getElementById("nameCheck");
        const nameDisplay = document.getElementById("displayReceiverName");

        if (accInput.length >= 6) {
          nameDisplay.innerText = "កំពុងស្វែងរក...";
          status.innerText = "↻";
          status.className = "check-status status-loading";
          typingTimer = setTimeout(checkName, 450);
        } else {
          resetCheck();
        }
      }

      async function checkName() {
        const acc = document.getElementById("receiverAcc").value.trim();
        const nameDisplay = document.getElementById("displayReceiverName"),
          status = document.getElementById("nameCheck"),
          boxUI = document.getElementById("receiverBoxUI"),
          iconUI = document.getElementById("receiverIconUI"),
          curBadge = document.getElementById("receiverCurBadge");

        if (acc.startsWith("UFND-")) {
          fetch("/api/ufund/get-name", {
            method: "POST",
            headers: authHeaders,
            body: JSON.stringify({ qrString: acc }),
          })
            .then((r) => r.json())
            .then((d) => {
              nameDisplay.innerHTML = d.success
                ? `U-Fund (${d.projectName})`
                : "U-Fund (Scan Pay)";

              const bGroup = document.getElementById("bailoutGroup");
              const bTarget = document.getElementById("bailoutTarget");
              const previousSelection = bTarget ? bTarget.value : "";

              if (
                d.success &&
                d.overdueMembers &&
                d.overdueMembers.length > 0
              ) {
                bGroup.style.display = "block";
                let opts = `<option value="">👤 បង់ប្រាក់ចូលគណនីខ្លួនឯង (Advance)</option>`;
                d.overdueMembers.forEach((m) => {
                  if (m.username !== user.username) {
                    opts += `<option value="${m.username}">🤝 ចេញលុយជួស ${m.fullName} (ជំពាក់ $${m.debtAmount})</option>`;
                  }
                });
                bTarget.innerHTML = opts;
                if (previousSelection) bTarget.value = previousSelection;
              } else {
                if (bGroup) bGroup.style.display = "none";
              }
            })
            .catch(() => (nameDisplay.innerHTML = "U-Fund (Scan Pay)"));

          status.innerText = "✔";
          status.className = "check-status status-ok";
          boxUI.style.borderColor = "#10b981";
          boxUI.style.background = "#ecfdf5";
          iconUI.style.background = "#10b981";
          iconUI.style.color = "white";
          iconUI.innerHTML = '<i class="fa-solid fa-piggy-bank"></i>';
          if (curBadge) {
            curBadge.style.display = "inline-flex";
            curBadge.innerHTML = `${flagImgHtml("us")} <span>គណនីសន្សំរួម USD ($)</span>`;
          }
          targetUserIsKHR = false;
          calculateExchangePreview();
          return true;
        }

        if (acc.length < 6) return false;

        try {
          const res = await fetch("/api/check-account", {
            method: "POST",
            headers: authHeaders,
            body: JSON.stringify({ accountNumber: acc }),
          });
          const data = await res.json();
          if (data.success) {
            nameDisplay.innerHTML = `<strong>${data.username.toUpperCase()}</strong>`;
            status.innerText = "✔";
            status.className = "check-status status-ok";
            boxUI.style.borderColor = "#10b981";
            boxUI.style.background = "#ecfdf5";

            // 🌟 បង្ហាញរូប Icon ហាងទំនិញ ឬ រូប Profile ពិតរបស់អតិថិជន
            if (data.isMerchant) {
              iconUI.style.background = data.username.includes(" BY ")
                ? "#0284c7"
                : "#8b5cf6";
              boxUI.style.borderColor = iconUI.style.background;
              iconUI.style.color = "white";
              iconUI.innerHTML = '<i class="fa-solid fa-store"></i>';
            } else if (data.profileImage && data.profileImage.trim() !== "") {
              iconUI.style.background = "#ffffff";
              iconUI.innerHTML = `<img src="${data.profileImage}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;" onerror="this.outerHTML='<i class=\\'fa-solid fa-user\\'></i>'">`;
            } else if (
              acc.includes("SAV") ||
              data.username.toLowerCase().includes("saving")
            ) {
              iconUI.style.background = "#10b981";
              iconUI.style.color = "white";
              iconUI.innerHTML = '<i class="fa-solid fa-piggy-bank"></i>';
            } else {
              iconUI.style.background = "#10b981";
              iconUI.style.color = "white";
              iconUI.innerHTML = '<i class="fa-solid fa-user"></i>';
            }

            targetUserIsKHR = Boolean(data.isReceiverKHR);
            if (curBadge) {
              curBadge.style.display = "inline-flex";
              curBadge.innerHTML = targetUserIsKHR
                ? `${flagImgHtml("kh")} <span>គណនីទទួលប្រាក់រៀល (KHR ៛)</span>`
                : `${flagImgHtml("us")} <span>គណនីទទួលប្រាក់ដុល្លារ (USD $)</span>`;
            }

            if (data.fxRates) {
              currentFXRates = data.fxRates;
              updateHeaderFxBadge();
            }
            if (Array.isArray(data.feeTiers)) {
              currentFeeTiers = data.feeTiers;
            }
            if (data.transferLimit) {
              systemDailyLimitUSD = parseFloat(data.transferLimit) || 5000;
            }
            calculateExchangePreview();
            return true;
          } else {
            nameDisplay.innerText = "រកមិនឃើញគណនី (Unknown)";
            status.innerText = "✘";
            status.className = "check-status status-err";
            boxUI.style.borderColor = "#ef4444";
            boxUI.style.background = "#fef2f2";
            iconUI.style.background = "#ef4444";
            iconUI.style.color = "white";
            iconUI.innerHTML = '<i class="fa-solid fa-user-xmark"></i>';
            if (curBadge) curBadge.style.display = "none";
            targetUserIsKHR = null;
            calculateExchangePreview();
            return false;
          }
        } catch (error) {
          return false;
        }
      }

      function resetCheck() {
        document.getElementById("displayReceiverName").innerText = "...";
        document.getElementById("nameCheck").innerText = "";
        const b = document.getElementById("receiverBoxUI"),
          i = document.getElementById("receiverIconUI"),
          curBadge = document.getElementById("receiverCurBadge");
        b.style.borderColor = "#cbd5e1";
        b.style.background = "#f8fafc";
        i.style.background = "#e0f2f1";
        i.style.color = "#004d40";
        i.innerHTML = '<i class="fa-solid fa-user"></i>';
        if (curBadge) curBadge.style.display = "none";
        targetUserIsKHR = null;
        calculateExchangePreview();
        const bGroup = document.getElementById("bailoutGroup");
        if (bGroup) bGroup.style.display = "none";
      }

      // 🧮 គណនាការបំប្លែងរូបិយប័ណ្ណទាំង ៣ ជ្រុង (គណនីអ្នកផ្ញើ ⇄ រូបិយប័ណ្ណវាយបញ្ចូល ⇄ គណនីអ្នកទទួល) + ថ្លៃសេវា
      function getCalculatedTransferSummary() {
        const enteredAmt =
          parseFloat(document.getElementById("amount").value) || 0;
        const sel = document.getElementById("fromAccount");
        const senderAccCur =
          sel.options.length > 0
            ? sel.options[sel.selectedIndex].dataset.currency
            : "USD";
        const isSenderKHR = senderAccCur === "KHR";

        const buyRate = parseFloat(currentFXRates?.usdToKhrBuy) || 4050;
        const sellRate = parseFloat(currentFXRates?.usdToKhrSell) || 4100;

        // ១. គណនាប្រាក់ដើមដែលត្រូវកាត់ពីគណនីអ្នកផ្ញើ (senderPrincipalDeduction)
        let senderPrincipalDeduction = enteredAmt;
        if (isSenderKHR && selectedInputCurrency === "USD") {
          senderPrincipalDeduction = Math.round(enteredAmt * sellRate);
        } else if (!isSenderKHR && selectedInputCurrency === "KHR") {
          senderPrincipalDeduction = Number((enteredAmt / buyRate).toFixed(2));
        }

        // ២. គណនាទឹកប្រាក់ដែលអ្នកទទួលនឹងទទួលបានពិតប្រាកដ (receiverGets)
        const receiverCur =
          targetUserIsKHR === null
            ? selectedInputCurrency
            : targetUserIsKHR
              ? "KHR"
              : "USD";
        let receiverGets = enteredAmt;

        if (selectedInputCurrency === "USD" && receiverCur === "KHR") {
          receiverGets = Math.round(enteredAmt * buyRate);
        } else if (selectedInputCurrency === "KHR" && receiverCur === "USD") {
          receiverGets = Number((enteredAmt / sellRate).toFixed(2));
        }

        // ៣. គណនាថ្លៃសេវាតាមកម្រិតទឹកប្រាក់គិតជា USD (Tiered Fee)
        const transferUsdEquivalent = isSenderKHR
          ? senderPrincipalDeduction / sellRate
          : senderPrincipalDeduction;

        let feeUsd = 0;
        for (const tier of currentFeeTiers || []) {
          if (
            transferUsdEquivalent >= parseFloat(tier.min || 0) &&
            transferUsdEquivalent <= parseFloat(tier.max || 0)
          ) {
            feeUsd = parseFloat(tier.fee || 0);
            break;
          }
        }

        const feeInSenderCur = isSenderKHR
          ? Math.round(feeUsd * sellRate)
          : Number(feeUsd.toFixed(2));
        const totalDeduct = Number(
          (senderPrincipalDeduction + feeInSenderCur).toFixed(2),
        );

        let appliedFxText = "រូបិយប័ណ្ណដូចគ្នា (គ្មានការប្តូរប្រាក់)";
        if (
          senderAccCur !== receiverCur ||
          selectedInputCurrency !== senderAccCur
        ) {
          if (isSenderKHR || receiverCur === "USD") {
            appliedFxText = `អត្រា៖ $1 = ${sellRate.toLocaleString("en-US")} ៛`;
          }
          if (!isSenderKHR && receiverCur === "KHR") {
            appliedFxText = `អត្រា៖ $1 = ${buyRate.toLocaleString("en-US")} ៛`;
          }
        }

        return {
          enteredAmt,
          inputCurrency: selectedInputCurrency,
          senderAccCur,
          receiverCur,
          senderPrincipalDeduction,
          feeInSenderCur,
          totalDeduct,
          receiverGets,
          transferUsdEquivalent,
          appliedFxText,
        };
      }

      function calculateExchangePreview() {
        const box = document.getElementById("exchangePreview");
        const summary = getCalculatedTransferSummary();

        if (
          !summary.enteredAmt ||
          summary.enteredAmt <= 0 ||
          targetUserIsKHR === null
        ) {
          box.style.display = "none";
          return;
        }

        const isSenderKHR = summary.senderAccCur === "KHR";
        const isRecKHR = summary.receiverCur === "KHR";

        document.getElementById("fxFlowLabel").innerHTML =
          `${flagImgHtml(isSenderKHR ? "kh" : "us")} <span>${summary.senderAccCur}</span> <i class="fa-solid fa-arrow-right" style="font-size:0.7rem;"></i> ${flagImgHtml(isRecKHR ? "kh" : "us")} <span>${summary.receiverCur}</span>`;
        document.getElementById("fxRateDisplay").innerText =
          summary.appliedFxText;

        document.getElementById("fxPrincipalDeductDisplay").innerText =
          isSenderKHR
            ? `${summary.senderPrincipalDeduction.toLocaleString("en-US")} ៛`
            : `$${summary.senderPrincipalDeduction.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

        const feeEl = document.getElementById("fxFeeDisplay");
        feeEl.style.color = "#ef4444"; // 🔴 ពណ៌ក្រហមជានិច្ចតាមសំណូមពរ
        feeEl.innerText =
          summary.feeInSenderCur === 0
            ? "$0.00 (ឥតគិតថ្លៃ)"
            : isSenderKHR
              ? `${summary.feeInSenderCur.toLocaleString("en-US")} ៛`
              : `$${summary.feeInSenderCur.toFixed(2)}`;

        document.getElementById("fxTotalDeductDisplay").innerText = isSenderKHR
          ? `${summary.totalDeduct.toLocaleString("en-US")} ៛`
          : `$${summary.totalDeduct.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

        document.getElementById("fxResultDisplay").innerText = isRecKHR
          ? `${summary.receiverGets.toLocaleString("en-US")} ៛`
          : `$${summary.receiverGets.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

        box.style.display = "block";
      }

      async function validateAndOpenPin() {
        if (isTransactionCommitted) return;

        const sel = document.getElementById("fromAccount");
        const opt = sel.options[sel.selectedIndex];
        const bal = parseFloat(opt.dataset.balance || 0);
        const accDailyLimit = parseFloat(opt.dataset.dailyLimit || 0);
        const summary = getCalculatedTransferSummary();

        if (!summary.enteredAmt || summary.enteredAmt <= 0) {
          return Swal.fire(
            "បម្រាម",
            "សូមបញ្ចូលចំនួនទឹកប្រាក់ឱ្យបានត្រឹមត្រូវ!",
            "warning",
          );
        }

        // 🛡️ ១. ឆែកដែនកំណត់ប្រចាំថ្ងៃរបស់ Admin (Global Daily Transfer Limit)
        if (summary.transferUsdEquivalent > systemDailyLimitUSD) {
          return Swal.fire(
            "លើសដែនកំណត់ប្រចាំថ្ងៃ!",
            `ចំនួនទឹកប្រាក់លើសពិដានអតិបរមាប្រចាំថ្ងៃដែលធនាគារកំណត់ ($${systemDailyLimitUSD.toLocaleString()}/ថ្ងៃ)!`,
            "error",
          );
        }

        // 🛡️ ២. ឆែកដែនកំណត់ប្រចាំថ្ងៃរបស់គណនីផ្ទាល់ខ្លួន
        if (
          accDailyLimit > 0 &&
          summary.senderPrincipalDeduction > accDailyLimit
        ) {
          const limStr =
            summary.senderAccCur === "KHR"
              ? `${accDailyLimit.toLocaleString()} ៛`
              : `$${accDailyLimit.toLocaleString()}`;
          return Swal.fire(
            "លើសដែនកំណត់គណនី!",
            `គណនីនេះអាចផ្ទេរចេញបានត្រឹមតែ ${limStr} ក្នុងមួយថ្ងៃប៉ុណ្ណោះ!`,
            "error",
          );
        }

        // 🛡️ ៣. ឆែកសមតុល្យគណនី (រួមបញ្ចូលថ្លៃសេវា)
        if (summary.totalDeduct > bal) {
          return Swal.fire(
            "សមតុល្យមិនគ្រប់គ្រាន់",
            "ទឹកប្រាក់ក្នុងគណនីរបស់អ្នកមិនគ្រប់គ្រាន់សម្រាប់ការផ្ទេរ និងថ្លៃសេវាទេ!",
            "error",
          );
        }

        if (
          !(await checkName()) &&
          document.getElementById("nameCheck").innerText.includes("✘")
        ) {
          return Swal.fire("Error", "រកមិនឃើញគណនីអ្នកទទួលទេ!", "error");
        }

        const recAcc = document.getElementById("receiverAcc").value.trim();
        const inSym = summary.inputCurrency === "USD" ? "$" : "៛";
        const displayAmt =
          summary.inputCurrency === "USD"
            ? summary.enteredAmt.toFixed(2)
            : summary.enteredAmt.toLocaleString();

        requestPinVerification(
          "បញ្ជាក់ការវេរប្រាក់",
          `វេរប្រាក់ ${inSym}${displayAmt} ទៅកាន់គណនី ${recAcc}`,
          async function (pinCode) {
            const srcAcc = sel.value;
            const submitBtn = document.getElementById("btnSubmitTransfer");
            if (submitBtn) submitBtn.disabled = true;

            Swal.fire({
              title: "កំពុងដំណើរការ...",
              allowOutsideClick: false,
              allowEscapeKey: false,
              didOpen: () => Swal.showLoading(),
            });

            let url = recAcc.startsWith("UFND-")
              ? "/api/ufund/scan-pay"
              : "/api/transfer";
            let body = recAcc.startsWith("UFND-")
              ? {
                  username: user.username,
                  qrString: recAcc,
                  amount: summary.enteredAmt,
                  pin: pinCode,
                  bailoutTarget:
                    document.getElementById("bailoutGroup") &&
                    document.getElementById("bailoutGroup").style.display !==
                      "none"
                      ? document.getElementById("bailoutTarget").value
                      : "",
                }
              : {
                  senderUsername: user.username,
                  senderAccount: srcAcc,
                  receiverAccount: recAcc,
                  amount: summary.enteredAmt,
                  inputCurrency: summary.inputCurrency, // 🌟 បញ្ជូនរូបិយប័ណ្ណដែលគាត់បានរើសវាយ
                  remark:
                    document.getElementById("remark").value ||
                    (orderId ? `Payment for ${orderId}` : ""),
                  pin: pinCode,
                  trxMethod:
                    urlParamsGlobal.get("source") === "qr" ||
                    urlParamsGlobal.has("acc")
                      ? "QR Scan"
                      : "Account Input",
                  currency: summary.senderAccCur,
                  orderId: orderId,
                };

            try {
              const res = await fetch(url, {
                method: "POST",
                headers: authHeaders,
                body: JSON.stringify(body),
              });
              const d = await res.json();

              if (d.success) {
                // 🔒 វាយ PIN ត្រូវ និងជោគជ័យហើយ -> ចាក់សោមិនឱ្យចុចថយក្រោយដាច់ខាត!
                isTransactionCommitted = true;
                history.pushState(null, null, location.href);
                const topBack = document.getElementById("topBackBtn");
                if (topBack) topBack.style.pointerEvents = "none";

                // ១. ប្រសិនបើជា U-Fund
                if (recAcc.startsWith("UFND-")) {
                  Swal.close();
                  try {
                    new Audio(
                      "https://notificationsounds.com/storage/sounds/file-sounds-1148-juntos.mp3",
                    ).play();
                  } catch (e) {}
                  Swal.fire({
                    icon: "success",
                    title: "ដាក់ប្រាក់ជោគជ័យ",
                    text: d.message,
                    confirmButtonColor: "#004d40",
                    allowOutsideClick: false,
                  }).then(() => window.location.replace("ufund.html"));
                  return;
                }

                // ២. អាប់ដេតទិន្នន័យសមតុល្យថ្មីក្នុង SessionStorage
                if (d.user) {
                  sessionStorage.setItem("user", JSON.stringify(d.user));
                  Object.assign(user, d.user);
                  populateSourceAccounts();
                }

                Swal.close();

                try {
                  new Audio(
                    "https://notificationsounds.com/storage/sounds/file-sounds-1148-juntos.mp3",
                  ).play();
                } catch (e) {}

                // ៣. ដំណើរការ Callback ទៅកាន់ហាងទំនិញ (បើមាន)
                if (orderId && callbackUrl) {
                  fetch(callbackUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                      orderId: orderId,
                      amount: summary.enteredAmt,
                      user: shopBuyerName,
                      items: items,
                    }),
                  }).catch(() => {});
                }

                // ៤. ហៅ openGlobalSlip ពី js/slip.js ដែលមានស្រាប់របស់បងធំ!
                const presentFinalSlip = () => {
                  if (typeof openGlobalSlip === "function") {
                    openGlobalSlip(d.slipData, user.username);
                  }
                };

                // ៥. ហៅកងបង្វិលសំណាងពី js/luckySpin.js បើវេរចាប់ពី $10 ឡើងទៅ
                if (
                  summary.transferUsdEquivalent >= 10 &&
                  typeof window.openLuckySpinModal === "function"
                ) {
                  window.openLuckySpinModal({
                    user,
                    authHeaders,
                    slipData: d.slipData,
                    onFinish: presentFinalSlip,
                  });
                } else {
                  presentFinalSlip();
                }
              } else {
                // ❌ បើវាយ PIN ខុស ឬសមតុល្យមិនគ្រប់ -> បើកឱ្យវាយម្ដងទៀតបានធម្មតា
                if (submitBtn) submitBtn.disabled = false;
                Swal.close();
                Swal.fire("បរាជ័យ", d.message, "error");
              }
            } catch (e) {
              if (submitBtn) submitBtn.disabled = false;
              Swal.close();
              Swal.fire("Error", "Connection Error: " + e.message, "error");
            }
          },
        );
      }

      function returnToShopOrDashboard() {
        if (callbackUrl) window.location.replace(new URL(callbackUrl).origin);
        else if (orderId) {
          window.close();
          setTimeout(() => {
            window.location.replace("dashboard.html");
          }, 300);
        } else window.location.replace("dashboard.html");
      }
    </script>
  </body>
</html>

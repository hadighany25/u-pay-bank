<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transfer Money - U-Pay</title>
    <link rel="icon" type="image/png" href="images/favicon.png" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/pin.js"></script>
    <link rel="stylesheet" href="style.css" />

    <style>
      body {
        visibility: hidden;
        opacity: 0;
        background-color: #f2f4f6;
        margin: 0;
        font-family: "Kantumruy Pro", "Inter", sans-serif !important;
        display: flex;
        justify-content: center;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
        transition:
          opacity 0.4s ease,
          background-color 0.3s ease;
      }
      body.loaded {
        visibility: visible;
        opacity: 1;
      }
      *:not(i):not([class*="fa-"]) {
        font-family: "Kantumruy Pro", "Inter", sans-serif !important;
      }
      .fas,
      .fab,
      .far,
      .fa {
        font-family: "Font Awesome 6 Free", "Font Awesome 6 Brands" !important;
        font-weight: 900 !important;
      }
      .app-container {
        width: 100%;
        max-width: 450px;
        background: #fff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        position: relative;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.05);
        transition: background-color 0.3s ease;
      }
      .nav-header {
        padding: 20px;
        background: #004d40;
        color: #fff;
        display: flex;
        align-items: center;
        gap: 15px;
        font-size: 1.1rem;
        font-weight: 600;
      }
      .nav-header a {
        color: #fff;
        text-decoration: none;
      }
      .transfer-form {
        padding: 20px 25px;
        flex: 1;
      }
      .section-label {
        font-size: 0.85rem;
        color: #64748b;
        font-weight: 700;
        text-transform: uppercase;
        margin-bottom: 15px;
        letter-spacing: 0.5px;
      }

      .recent-contacts-container {
        margin-bottom: 25px;
        display: none;
      }
      .contacts-scroll {
        display: flex;
        gap: 15px;
        overflow-x: auto;
        padding: 10px 5px;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }
      .contacts-scroll::-webkit-scrollbar {
        display: none;
      }
      .contact-item {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        cursor: pointer;
        transition: transform 0.3s ease;
        min-width: 65px;
        flex-shrink: 0;
      }
      .contact-item:hover {
        transform: translateY(-8px);
      }
      .contact-avatar {
        width: 55px;
        height: 55px;
        border-radius: 50%;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 1.2rem;
        font-weight: 700;
        position: relative;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        border: 2px solid white;
      }
      .delete-btn {
        position: absolute;
        top: -2px;
        right: -2px;
        background-color: #ff4d4f;
        color: white;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        font-size: 11px;
        display: flex;
        justify-content: center;
        align-items: center;
        opacity: 0;
        transition:
          opacity 0.2s ease,
          transform 0.2s ease;
        z-index: 10;
      }
      .contact-item:hover .delete-btn {
        opacity: 1;
      }
      .delete-btn:hover {
        transform: scale(1.2);
      }
      .contact-info {
        margin-top: 8px;
        text-align: center;
        min-height: 35px;
        width: 100%;
      }
      .short-name {
        font-size: 0.7rem;
        font-weight: 600;
        color: #334155;
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: opacity 0.2s ease;
      }
      .full-details {
        display: none;
        font-size: 0.65rem;
        color: #666;
        white-space: nowrap;
      }
      .full-details .f-name {
        font-weight: 700;
        color: #006039;
      }
      .contact-item:hover .short-name {
        display: none;
      }
      .contact-item:hover .full-details {
        display: block;
        animation: fadeIn 0.3s ease;
      }

      .receiver-box {
        text-align: center;
        margin-bottom: 25px;
        padding: 20px;
        background: #f8f9fa;
        border-radius: 20px;
        border: 1px dashed #ccc;
        transition: 0.3s;
      }
      .receiver-icon {
        width: 60px;
        height: 60px;
        background: #e0f2f1;
        border-radius: 50%;
        margin: 0 auto 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #004d40;
        font-size: 1.5rem;
        overflow: hidden;
      }
      .input-group {
        margin-bottom: 20px;
        position: relative;
      }
      .input-group label {
        font-weight: 600;
        font-size: 0.9rem;
        color: #555;
        margin-bottom: 8px;
        display: block;
      }
      .main-input {
        width: 100%;
        padding: 15px;
        border: 1px solid #ddd;
        border-radius: 12px;
        font-size: 1rem;
        outline: none;
        background: #fff;
        box-sizing: border-box;
        transition: 0.3s;
      }
      .main-input:focus {
        border-color: #004d40;
        box-shadow: 0 0 0 3px rgba(0, 77, 64, 0.1);
      }
      .main-input[readonly] {
        background-color: #e9ecef;
        color: #6c757d;
        cursor: not-allowed;
      }
      .check-status {
        position: absolute;
        right: 15px;
        top: 42px;
        font-size: 0.9rem;
        font-weight: bold;
      }
      .status-ok {
        color: #00b894;
      }
      .status-err {
        color: #e74c3c;
      }
      .status-loading {
        color: #f59e0b;
      }
      .confirm-btn {
        width: 100%;
        padding: 16px;
        background: #004d40;
        color: #fff;
        border: none;
        border-radius: 16px;
        font-size: 1.1rem;
        font-weight: bold;
        cursor: pointer;
        margin-top: 10px;
        box-shadow: 0 8px 20px rgba(0, 77, 64, 0.2);
        transition: 0.3s;
      }
      .confirm-btn:active {
        transform: scale(0.98);
      }

      .fx-preview-box {
        background: #f0fdf4;
        border: 1px solid #bbf7d0;
        padding: 12px 15px;
        border-radius: 12px;
        margin-top: -10px;
        margin-bottom: 20px;
        display: none;
        animation: fadeIn 0.3s ease;
      }
      .fx-preview-box p {
        margin: 0;
        font-size: 0.85rem;
        color: #166534;
        display: flex;
        justify-content: space-between;
        margin-bottom: 5px;
      }
      .fx-preview-box p:last-child {
        margin-bottom: 0;
        font-weight: bold;
      }
      .fx-preview-box .fx-result {
        color: #15803d;
        font-size: 1rem;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        z-index: 9999;
        align-items: center;
        justify-content: center;
        flex-direction: column;
      }
      .slip-container {
        width: 340px;
        margin: 0 auto;
        background: #fff;
        border-radius: 20px;
        position: relative;
        overflow: hidden;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        animation: slideUp 0.4s ease-out;
      }
      @keyframes slideUp {
        from {
          transform: translateY(50px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }
      .slip-header {
        background: #004d40;
        padding: 25px 20px 30px;
        text-align: center;
        color: #fff;
      }
      .slip-status-icon {
        width: 60px;
        height: 60px;
        background: #fff;
        color: #004d40;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.8rem;
        margin: 0 auto 10px;
      }
      .slip-title {
        font-weight: 600;
        font-size: 1.1rem;
        margin-top: 5px;
      }
      .slip-amount {
        font-size: 2.5rem;
        font-weight: 800;
        margin: 5px 0 0;
        letter-spacing: -1px;
      }
      .slip-body {
        padding: 20px 25px;
        background: #fff;
        position: relative;
      }
      .dashed-line {
        margin: 15px -25px;
        border-top: 2px dashed #ddd;
        position: relative;
      }
      .dashed-line::before,
      .dashed-line::after {
        content: "";
        position: absolute;
        top: -10px;
        width: 20px;
        height: 20px;
        background: rgba(0, 0, 0, 0.85);
        border-radius: 50%;
      }
      .dashed-line::before {
        left: -10px;
      }
      .dashed-line::after {
        right: -10px;
      }
      .detail-row {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 12px;
        font-size: 0.9rem;
      }
      .d-label {
        color: #888;
        font-weight: 500;
      }
      .d-value {
        font-weight: 700;
        color: #1f2937;
        text-align: right;
        max-width: 60%;
        word-break: break-word;
      }
      .d-mono {
        font-family: "Courier New", monospace;
        letter-spacing: 0.5px;
        color: #004d40;
        font-weight: bold;
      }
      .slip-footer-info {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-top: 10px;
      }
      .qr-box {
        display: flex;
        align-items: center;
        gap: 10px;
        border: 1px solid #eee;
        padding: 5px 10px;
        border-radius: 10px;
        background: #f9fafb;
      }
      .qr-img {
        width: 45px;
        height: 45px;
      }
      .qr-text {
        font-size: 0.7rem;
        font-weight: 800;
        color: #004d40;
        display: flex;
        flex-direction: column;
        line-height: 1.1;
      }
      .footer-logo {
        width: 80px;
      }
      .slip-actions {
        display: flex;
        justify-content: center;
        gap: 40px;
        padding: 25px;
        background: #fff;
        border-top: 1px solid #f0f0f0;
      }
      .action-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        color: #004d40;
      }
      .action-circle {
        width: 55px;
        height: 55px;
        border-radius: 50%;
        border: 1px solid #eee;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.3rem;
        background: #fff;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      }
      .wheel-box {
        position: relative;
        width: 280px;
        height: 280px;
        margin: 20px auto 40px;
      }
      .wheel-pointer {
        position: absolute;
        top: -15px;
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 0;
        border-left: 15px solid transparent;
        border-right: 15px solid transparent;
        border-top: 25px solid #fff;
        z-index: 10;
      }
      .wheel-canvas {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 5px solid #fff;
        box-shadow: 0 0 25px rgba(255, 215, 0, 0.5);
      }
      .btn-spin-center {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 70px;
        height: 70px;
        border-radius: 50%;
        border: 4px solid #fff;
        background: #004d40;
        color: #fff;
        font-weight: 800;
        font-size: 1.1rem;
        cursor: pointer;
        z-index: 5;
      }

      /* DARK MODE */
      body.dark-mode {
        background-color: #121212 !important;
        color: #fff !important;
      }
      body.dark-mode .app-container {
        background-color: #121212 !important;
      }
      body.dark-mode .nav-header {
        background-color: #1e1e1e !important;
        border-bottom: 1px solid #333;
      }
      body.dark-mode .receiver-box {
        background-color: #1e1e1e !important;
        border-color: #333;
      }
      body.dark-mode .main-input {
        background: #1e1e1e !important;
        color: #fff !important;
        border-color: #444;
      }
      body.dark-mode .input-group label {
        color: #cbd5e1;
      }
      body.dark-mode .section-label {
        color: #94a3b8;
      }
      body.dark-mode .short-name {
        color: #cbd5e1;
      }
      body.dark-mode .full-details {
        color: #94a3b8;
      }
      body.dark-mode .full-details .f-name {
        color: #4ade80 !important;
      }
      body.dark-mode .contact-avatar {
        border-color: #121212;
      }
      body.dark-mode .fx-preview-box {
        background: rgba(22, 101, 52, 0.2);
        border-color: #14532d;
      }
      body.dark-mode .fx-preview-box p {
        color: #a7f3d0;
      }
      body.dark-mode .slip-container,
      body.dark-mode .slip-body {
        background: #fff !important;
      }
      body.dark-mode .d-value {
        color: #1f2937 !important;
      }
      body.dark-mode .d-label {
        color: #888 !important;
      }
    </style>
  </head>
  <body>
    <div class="app-container">
      <div class="nav-header">
        <a href="dashboard.html"><i class="fa-solid fa-arrow-left"></i></a>
        <span data-lang="title_transfer">Transfer Money</span>
      </div>

      <div class="transfer-form">
        <!-- RECENT CONTACTS -->
        <div class="recent-contacts-container" id="recentContactsBlock">
          <p class="section-label" data-lang="recent_contacts">
            Recent Contacts
          </p>
          <div class="contacts-scroll" id="contactsList"></div>
        </div>

        <div class="receiver-box" id="receiverBoxUI">
          <div class="receiver-icon" id="receiverIconUI">
            <i class="fa-solid fa-user"></i>
          </div>
          <h3
            id="displayReceiverName"
            style="margin: 0; color: #004d40; min-height: 24px"
          >
            ...
          </h3>
          <p
            style="margin: 5px 0 0; color: #888; font-size: 0.9rem"
            data-lang="receiver_label"
          >
            Receiver
          </p>
        </div>

        <div class="input-group">
          <label data-lang="source_account">Source Account</label>
          <select
            id="fromAccount"
            class="main-input"
            onchange="updateBalanceDisplay()"
          ></select>
          <p
            id="availableBalance"
            style="
              font-size: 0.85rem;
              color: #00b894;
              margin-top: 8px;
              font-weight: 600;
            "
          ></p>
        </div>

        <div class="input-group">
          <label data-lang="receiver_acc">Receiver Account</label>
          <input
            type="text"
            id="receiverAcc"
            class="main-input"
            placeholder="Enter account number"
            style="text-transform: uppercase"
            oninput="debounceCheckName()"
          />
          <span id="nameCheck" class="check-status"></span>
        </div>

        <div class="input-group">
          <label data-lang="amount_label">Amount</label>
          <input
            type="number"
            id="amount"
            class="main-input"
            placeholder="0.00"
            oninput="calculateExchangePreview()"
          />
        </div>

        <div id="exchangePreview" class="fx-preview-box">
          <p>
            <span data-lang="exchange_rate">Exchange Rate:</span
            ><span class="fx-rate" id="fxRateDisplay">...</span>
          </p>
          <p>
            <span data-lang="receiver_gets">Receiver Gets:</span
            ><span class="fx-result" id="fxResultDisplay">...</span>
          </p>
        </div>

        <div class="input-group">
          <label data-lang="remark">Remark</label>
          <input
            type="text"
            id="remark"
            class="main-input"
            placeholder="Optional"
          />
        </div>

        <button
          onclick="validateAndOpenPin()"
          class="confirm-btn"
          data-lang="btn_transfer"
        >
          Transfer Now
        </button>
      </div>
    </div>

    <!-- Modals -->
    <div
      id="spinModal"
      class="modal-overlay"
      style="background: rgba(15, 23, 42, 0.95)"
    >
      <h2 style="color: white; margin: 0 0 10px; font-size: 1.8rem">
        🎉 <span data-lang="spin_title">Lucky Spin</span> 🎉
      </h2>
      <p
        style="color: #a7f3d0; margin-bottom: 20px; font-size: 0.9rem"
        data-lang="spin_desc"
      >
        You transferred over $10! Spin to win Cashback!
      </p>
      <div class="wheel-box">
        <div class="wheel-pointer"></div>
        <canvas
          id="wheelCanvas"
          class="wheel-canvas"
          width="280"
          height="280"
        ></canvas>
        <button id="spinBtn" class="btn-spin-center" onclick="startSpin()">
          SPIN
        </button>
      </div>
      <button
        onclick="skipSpin()"
        style="
          background: transparent;
          color: #94a3b8;
          border: none;
          font-size: 1rem;
          cursor: pointer;
          font-weight: 600;
          padding: 10px 20px;
        "
        data-lang="btn_skip"
      >
        Skip & View Slip
      </button>
    </div>

    <div id="slipModal" class="modal-overlay">
      <div id="captureArea" class="slip-container">
        <div class="slip-header">
          <div class="slip-status-icon"><i class="fa-solid fa-check"></i></div>
          <div class="slip-title" data-lang="transfer_success">
            Transfer Successful
          </div>
          <div class="slip-amount" id="slipAmount">$0.00</div>
        </div>
        <div class="slip-body">
          <div class="detail-row">
            <span class="d-label">Trx ID</span
            ><span class="d-value d-mono" id="slipRef">...</span>
          </div>
          <div class="detail-row">
            <span class="d-label">Hash</span
            ><span
              class="d-value d-mono"
              id="slipHash"
              style="font-size: 0.8rem"
              >...</span
            >
          </div>
          <div class="dashed-line"></div>
          <div class="detail-row">
            <span class="d-label">From</span
            ><span class="d-value" id="slipSender">...</span>
          </div>
          <div class="detail-row">
            <span class="d-label">To</span
            ><span class="d-value" id="slipReceiver">...</span>
          </div>
          <div class="detail-row">
            <span class="d-label">Payment Via</span
            ><span class="d-value" id="slipMethod">Account Input</span>
          </div>
          <div class="detail-row">
            <span class="d-label">Date</span
            ><span class="d-value" id="slipDate">...</span>
          </div>
          <div class="detail-row">
            <span class="d-label">Fee</span><span class="d-value">$0.00</span>
          </div>
          <div class="detail-row">
            <span class="d-label">Remark</span
            ><span class="d-value" id="slipRemark">...</span>
          </div>
          <div class="slip-footer-info">
            <div class="qr-box">
              <img
                src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=Verify"
                class="qr-img"
              />
              <div class="qr-text"><span>SCAN TO</span><span>CHECK</span></div>
            </div>
            <img
              src="images/logo.png"
              class="footer-logo"
              onerror="this.style.display = 'none'"
            />
          </div>
        </div>
        <div class="slip-actions">
          <div class="action-item" onclick="saveSlipImage()">
            <div class="action-circle done">
              <i class="fa-solid fa-share-nodes"></i>
            </div>
            <span class="action-text">Share</span>
          </div>
          <div class="action-item" onclick="location.reload()">
            <div class="action-circle done">
              <i class="fa-solid fa-rotate-right"></i>
            </div>
            <span class="action-text">New Trx</span>
          </div>
          <div class="action-item" onclick="returnToShopOrDashboard()">
            <div class="action-circle done">
              <i class="fa-solid fa-xmark"></i>
            </div>
            <span class="action-text">Done</span>
          </div>
        </div>
      </div>
    </div>

    <script>
      const uPayUserString = sessionStorage.getItem("user");
      const token = sessionStorage.getItem("userToken");
      if (!uPayUserString || !token)
        window.location.href = "index.html" + window.location.search;

      const user = JSON.parse(uPayUserString);
      const authHeaders = {
        "Content-Type": "application/json",
        Authorization: `Bearer ${token}`,
      };

      const urlParamsGlobal = new URLSearchParams(window.location.search);
      const orderId =
        urlParamsGlobal.get("orderId") || urlParamsGlobal.get("o");
      const callbackUrl = urlParamsGlobal.get("callback");
      const items = urlParamsGlobal.get("items");
      const shopBuyerName = urlParamsGlobal.get("user");

      let targetUserIsKHR = null,
        currentFXRates = { usdToKhrBuy: 4050, usdToKhrSell: 4100 },
        currentSlipData = null,
        spinIsActive = false;

      window.addEventListener("DOMContentLoaded", async () => {
        applyTheme();
        document.body.classList.add("loaded");
        populateSourceAccounts();

        try {
          const fxRes = await fetch("/api/fx/rates", { headers: authHeaders });
          const fxData = await fxRes.json();
          if (fxData.success) currentFXRates = fxData.rates;
        } catch (e) {}

        const urlParams = new URLSearchParams(window.location.search);

        if (urlParams.get("acc")) {
          let rawAcc = urlParams.get("acc");
          let parts = rawAcc.split(":");

          let ai = document.getElementById("receiverAcc");
          ai.value = parts[0];
          ai.readOnly = true;
          ai.style.backgroundColor = "#e9ecef";

          if (
            parts[1] &&
            parseFloat(parts[1]) > 0 &&
            !urlParams.get("amount") &&
            !urlParams.get("a")
          ) {
            document.getElementById("amount").value = parts[1];
          }

          checkName();
        }

        let passedAmount = urlParams.get("amount") || urlParams.get("a");
        if (passedAmount) {
          let amti = document.getElementById("amount");
          amti.value = passedAmount;
          if (urlParams.get("lockAmount") === "true" || urlParams.has("a")) {
            amti.readOnly = true;
            amti.style.backgroundColor = "#e9ecef";
          }
        }

        loadRecentContacts();
        drawWheel();
      });

      function applyTheme() {
        if (
          localStorage.getItem("theme") === "dark" ||
          localStorage.getItem("darkMode_" + user.username) === "true"
        )
          document.body.classList.add("dark-mode");
      }

      function populateSourceAccounts() {
        const select = document.getElementById("fromAccount");
        select.innerHTML = "";
        let lang = localStorage.getItem("lang") || "en";
        const usdOpt = document.createElement("option");
        usdOpt.value = "MAIN_USD";
        usdOpt.dataset.currency = "USD";
        usdOpt.dataset.balance = user.balance || 0;
        usdOpt.text =
          (lang === "kh" ? "គណនី Main ($) - " : "Main Account ($) - ") +
          user.accountNumber;
        select.appendChild(usdOpt);

        const khrOpt = document.createElement("option");
        khrOpt.value = "MAIN_KHR";
        khrOpt.dataset.currency = "KHR";
        khrOpt.dataset.balance = user.balanceKHR || 0;
        khrOpt.text =
          (lang === "kh" ? "គណនី Main (៛) - " : "Main Account (៛) - ") +
          (user.accountNumberKHR || "N/A");
        select.appendChild(khrOpt);

        if (user.subAccounts && user.subAccounts.length > 0) {
          user.subAccounts.forEach((sub) => {
            const opt = document.createElement("option");
            opt.value = sub.accountNumber;
            opt.dataset.currency = sub.currency;
            opt.dataset.balance = sub.balance || 0;
            opt.text = `${sub.accountName} (${sub.currency === "USD" ? "$" : "៛"}) - ${sub.accountNumber}`;
            select.appendChild(opt);
          });
        }
        updateBalanceDisplay();
      }

      function updateBalanceDisplay() {
        const select = document.getElementById("fromAccount");
        if (select.options.length === 0) return;
        const opt = select.options[select.selectedIndex];
        const type = opt.dataset.currency,
          bal = parseFloat(opt.dataset.balance),
          sign = type === "USD" ? "$" : "៛";
        let textKey =
          (localStorage.getItem("lang") || "en") === "kh"
            ? "សមតុល្យអាចចាយបាន: "
            : "Available Balance: ";
        document.getElementById("availableBalance").innerText =
          type === "USD"
            ? `${textKey}${sign}${bal.toFixed(2)}`
            : `${textKey}${bal.toLocaleString("en-US")} ${sign}`;
        calculateExchangePreview();
      }

      function loadRecentContacts() {
        if (!user.transactions || user.transactions.length === 0) return;
        let contacts = [];
        let seenAccounts = new Set();

        for (let t of user.transactions) {
          if (t.amount < 0 && t.receiverAcc) {
            let recName = t.receiverName || t.partner || "Unknown";
            if (
              recName.toLowerCase() !== "unknown" &&
              !seenAccounts.has(t.receiverAcc)
            ) {
              seenAccounts.add(t.receiverAcc);
              contacts.push({ name: recName, acc: t.receiverAcc });
            }
          }
        }

        const container = document.getElementById("recentContactsBlock");
        const list = document.getElementById("contactsList");
        if (contacts.length === 0) {
          container.style.display = "none";
          return;
        }

        container.style.display = "block";
        list.innerHTML = "";
        const colors = [
          "#f43f5e",
          "#f97316",
          "#eab308",
          "#84cc16",
          "#10b981",
          "#06b6d4",
          "#0ea5e9",
          "#3b82f6",
          "#8b5cf6",
          "#d946ef",
          "#f472b6",
        ];

        contacts.slice(0, 10).forEach((c, index) => {
          const bgColor = colors[index % colors.length];
          const initials = c.name.substring(0, 2).toUpperCase();
          const shortName = c.name.split(" ")[0];

          list.innerHTML += `
          <div class="contact-item" onclick="selectContact('${c.acc}')">
            <div class="contact-avatar" style="background-color: ${bgColor};">
              ${initials}
              <div class="delete-btn" onclick="removeContact(event, '${c.acc}', this)">✖</div>
            </div>
            <div class="contact-info">
              <span class="short-name">${shortName}</span>
              <div class="full-details"><div class="f-name">${c.name}</div><div class="acc-num">${c.acc}</div></div>
            </div>
          </div>`;
        });
      }

      function selectContact(acc) {
        const input = document.getElementById("receiverAcc");
        if (!input.readOnly) {
          input.value = acc;
          checkName();
        }
      }

      function removeContact(event, accountNumber, element) {
        event.stopPropagation();
        const contactItem = element.closest(".contact-item");
        contactItem.style.opacity = "0";
        setTimeout(() => {
          contactItem.remove();
        }, 200);
      }

      let typingTimer;
      function debounceCheckName() {
        clearTimeout(typingTimer);
        const accInput = document.getElementById("receiverAcc").value;
        const status = document.getElementById("nameCheck");
        const nameDisplay = document.getElementById("displayReceiverName");

        if (accInput.length >= 6) {
          nameDisplay.innerText = "កំពុងស្វែងរក...";
          status.innerText = "↻";
          status.className = "check-status status-loading";
          typingTimer = setTimeout(checkName, 500);
        } else {
          resetCheck();
        }
      }

      async function checkName() {
        const acc = document.getElementById("receiverAcc").value;
        const nameDisplay = document.getElementById("displayReceiverName"),
          status = document.getElementById("nameCheck"),
          boxUI = document.getElementById("receiverBoxUI"),
          iconUI = document.getElementById("receiverIconUI");

        if (acc.startsWith("UFND-")) {
          fetch("/api/ufund/get-name", {
            method: "POST",
            headers: authHeaders,
            body: JSON.stringify({ qrString: acc }),
          })
            .then((r) => r.json())
            .then((d) => {
              nameDisplay.innerHTML = d.success
                ? `U-Fund (${d.projectName})`
                : "U-Fund (Scan Pay)";
            })
            .catch(() => (nameDisplay.innerHTML = "U-Fund (Scan Pay)"));
          status.innerText = "✔";
          status.className = "check-status status-ok";
          boxUI.style.borderColor = "#10b981";
          boxUI.style.background = "#ecfdf5";
          iconUI.style.background = "#10b981";
          iconUI.style.color = "white";
          iconUI.innerHTML = '<i class="fa-solid fa-piggy-bank"></i>';
          targetUserIsKHR = false;
          calculateExchangePreview();
          return true;
        }

        if (acc.length < 6) return false;

        try {
          const res = await fetch("/api/check-account", {
            method: "POST",
            headers: authHeaders,
            body: JSON.stringify({ accountNumber: acc }),
          });
          const data = await res.json();
          if (data.success) {
            nameDisplay.innerHTML = `<strong>${data.username.toUpperCase()}</strong>`;
            status.innerText = "✔";
            status.className = "check-status status-ok";
            boxUI.style.borderColor = "#10b981";
            boxUI.style.background = "#ecfdf5";
            iconUI.style.background = "#10b981";
            iconUI.style.color = "white";

            if (data.isMerchant && data.username.includes(" BY ")) {
              iconUI.style.background = "#0284c7";
              boxUI.style.borderColor = "#0284c7";
            }

            if (data.isMerchant)
              iconUI.innerHTML = '<i class="fa-solid fa-store"></i>';
            else if (data.profileImage && data.profileImage !== "")
              iconUI.innerHTML = `<img src="${data.profileImage}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`;
            else if (
              acc.includes("SAV") ||
              data.username.toLowerCase().includes("saving")
            )
              iconUI.innerHTML = '<i class="fa-solid fa-piggy-bank"></i>';
            else iconUI.innerHTML = '<i class="fa-solid fa-user"></i>';

            targetUserIsKHR = data.isReceiverKHR;
            if (data.fxRates) currentFXRates = data.fxRates;
            calculateExchangePreview();
            return true;
          } else {
            nameDisplay.innerText = "Unknown";
            status.innerText = "✘";
            status.className = "check-status status-err";
            boxUI.style.borderColor = "#ef4444";
            boxUI.style.background = "#fef2f2";
            iconUI.style.background = "#ef4444";
            iconUI.style.color = "white";
            iconUI.innerHTML = '<i class="fa-solid fa-user-xmark"></i>';
            targetUserIsKHR = null;
            calculateExchangePreview();
            return false;
          }
        } catch (error) {
          return false;
        }
      }

      function resetCheck() {
        document.getElementById("displayReceiverName").innerText = "...";
        document.getElementById("nameCheck").innerText = "";
        const b = document.getElementById("receiverBoxUI"),
          i = document.getElementById("receiverIconUI");
        b.style.borderColor = "#ccc";
        b.style.background = "#f8f9fa";
        i.style.background = "#e0f2f1";
        i.style.color = "#004d40";
        i.innerHTML = '<i class="fa-solid fa-user"></i>';
        targetUserIsKHR = null;
        calculateExchangePreview();
      }

      function calculateExchangePreview() {
        const amt = parseFloat(document.getElementById("amount").value),
          sel = document.getElementById("fromAccount"),
          type =
            sel.options.length > 0
              ? sel.options[sel.selectedIndex].dataset.currency
              : "USD",
          box = document.getElementById("exchangePreview");
        if (!amt || amt <= 0 || targetUserIsKHR === null || !currentFXRates) {
          box.style.display = "none";
          return;
        }
        if (type !== "KHR" && targetUserIsKHR) {
          document.getElementById("fxRateDisplay").innerText =
            `$1 = ${currentFXRates.usdToKhrBuy} ៛`;
          document.getElementById("fxResultDisplay").innerText =
            `${(amt * currentFXRates.usdToKhrBuy).toLocaleString("en-US")} ៛`;
          box.style.display = "block";
        } else if (type === "KHR" && !targetUserIsKHR) {
          document.getElementById("fxRateDisplay").innerText =
            `$1 = ${currentFXRates.usdToKhrSell} ៛`;
          document.getElementById("fxResultDisplay").innerText =
            `$${(amt / currentFXRates.usdToKhrSell).toFixed(2)}`;
          box.style.display = "block";
        } else box.style.display = "none";
      }

      function drawWheel() {
        const ctx = document.getElementById("wheelCanvas").getContext("2d");
        if (!ctx) return;
        const p = ["$0.05", "$0.50", "0.00", "$0.10", "$1.00", "$0.20"],
          c = [
            "#f59e0b",
            "#10b981",
            "#64748b",
            "#3b82f6",
            "#ef4444",
            "#8b5cf6",
          ],
          arc = Math.PI / (p.length / 2);
        ctx.clearRect(0, 0, 280, 280);
        for (let i = 0; i < p.length; i++) {
          let a = i * arc;
          ctx.beginPath();
          ctx.fillStyle = c[i];
          ctx.moveTo(140, 140);
          ctx.arc(140, 140, 140, a, a + arc, false);
          ctx.lineTo(140, 140);
          ctx.fill();
          ctx.save();
          ctx.fillStyle = "white";
          ctx.translate(
            140 + Math.cos(a + arc / 2) * 90,
            140 + Math.sin(a + arc / 2) * 90,
          );
          ctx.rotate(a + arc / 2 + Math.PI / 2);
          ctx.font = "bold 20px 'Inter'";
          ctx.fillText(
            p[i] === "0.00" ? "Oops!" : p[i],
            -ctx.measureText(p[i] === "0.00" ? "Oops!" : p[i]).width / 2,
            0,
          );
          ctx.restore();
        }
      }

      async function validateAndOpenPin() {
        const amt = parseFloat(document.getElementById("amount").value),
          sel = document.getElementById("fromAccount"),
          bal = parseFloat(sel.options[sel.selectedIndex].dataset.balance),
          l = localStorage.getItem("lang") || "en";

        if (!amt || amt <= 0)
          return Swal.fire(
            "Warning",
            l === "kh"
              ? "សូមបញ្ចូលចំនួនប្រាក់ត្រឹមត្រូវ"
              : "Please enter valid amount",
            "warning",
          );
        if (amt > bal)
          return Swal.fire(
            "Error",
            l === "kh" ? "សមតុល្យមិនគ្រប់គ្រាន់" : "Insufficient Balance",
            "error",
          );
        if (
          !(await checkName()) &&
          document.getElementById("nameCheck").innerText.includes("✘")
        )
          return Swal.fire("Error", "Receiver Not Found", "error");

        const recAcc = document.getElementById("receiverAcc").value;
        const type = sel.options[sel.selectedIndex].dataset.currency;
        const currSym = type === "USD" ? "$" : "៛";
        const displayAmt =
          type === "USD" ? amt.toFixed(2) : amt.toLocaleString();

        requestPinVerification(
          "បញ្ជាក់ការវេរប្រាក់",
          `វេរប្រាក់ ${currSym}${displayAmt} ទៅកាន់គណនី ${recAcc}`,
          async function (pinCode) {
            const srcAcc = sel.value;

            Swal.fire({
              title: "Processing...",
              didOpen: () => Swal.showLoading(),
            });

            let url = recAcc.startsWith("UFND-")
              ? "/api/ufund/scan-pay"
              : "/api/transfer";
            let body = recAcc.startsWith("UFND-")
              ? {
                  username: user.username,
                  qrString: recAcc,
                  amount: amt,
                  pin: pinCode,
                }
              : {
                  senderUsername: user.username,
                  senderAccount: srcAcc,
                  receiverAccount: recAcc,
                  amount: amt,
                  remark:
                    document.getElementById("remark").value ||
                    (orderId ? `Payment for ${orderId}` : ""),
                  pin: pinCode,
                  trxMethod:
                    urlParamsGlobal.get("source") === "qr" ||
                    urlParamsGlobal.has("acc")
                      ? "QR Scan"
                      : "Account Input",
                  currency: type,
                  orderId: orderId,
                };

            try {
              const res = await fetch(url, {
                method: "POST",
                headers: authHeaders,
                body: JSON.stringify(body),
              });
              const d = await res.json();
              Swal.close();
              if (d.success) {
                if (recAcc.startsWith("UFND-")) {
                  new Audio(
                    "https://notificationsounds.com/storage/sounds/file-sounds-1148-juntos.mp3",
                  ).play();
                  Swal.fire({
                    icon: "success",
                    title: "ដាក់ប្រាក់ជោគជ័យ",
                    text: d.message,
                    confirmButtonColor: "#004d40",
                  }).then(() => (window.location.href = "ufund.html"));
                  return;
                }

                // 🌟 អាប់ដេតសមតុល្យអ្នកផ្ញើក្នុង Memory
                if (srcAcc === "MAIN_USD") user.balance = d.newBalance;
                else if (srcAcc === "MAIN_KHR") user.balanceKHR = d.newBalance;
                else {
                  let idx = user.subAccounts.findIndex(
                    (a) => a.accountNumber === srcAcc,
                  );
                  if (idx !== -1) user.subAccounts[idx].balance = d.newBalance;
                }

                // 🔥 បញ្ចូលប្រវត្តិ "ផ្ញើ" ចូល Memory
                if (!user.transactions) user.transactions = [];
                user.transactions.unshift(d.slipData);

                // 🔥 បញ្ចូលប្រវត្តិ "ទទួល" ចូល Memory ភ្លាមៗបើជាការវេរចូលកុងខ្លួនឯង (អោយ Accounts លោត Slip អូតូ)
                if (d.extraSlip) {
                  user.transactions.unshift(d.extraSlip);

                  // Update Balance អ្នកទទួលលើទូរស័ព្ទតែមួយ
                  const rAcc = d.extraSlip.receiverAcc;
                  const rAmt = d.extraSlip.amount;
                  if (rAcc === user.accountNumber) user.balance += rAmt;
                  else if (rAcc === user.accountNumberKHR)
                    user.balanceKHR += rAmt;
                  else {
                    let rIdx = user.subAccounts.findIndex(
                      (a) => a.accountNumber === rAcc,
                    );
                    if (rIdx !== -1) user.subAccounts[rIdx].balance += rAmt;
                  }
                }

                sessionStorage.setItem("user", JSON.stringify(user));

                new Audio(
                  "https://notificationsounds.com/storage/sounds/file-sounds-1148-juntos.mp3",
                ).play();
                if (typeof showAppNotification === "function")
                  showAppNotification(
                    "Transfer Successful",
                    `You transferred ${amt}`,
                    "send",
                  );
                if (orderId && callbackUrl)
                  fetch(callbackUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                      orderId: orderId,
                      amount: amt,
                      user: shopBuyerName,
                      items: items,
                    }),
                  }).catch((e) => {});
                if (parseFloat(amt) >= (type === "USD" ? 10 : 40000)) {
                  currentSlipData = d.slipData;
                  document.getElementById("spinModal").style.display = "flex";
                  let c = document.getElementById("wheelCanvas");
                  c.style.transition = "none";
                  c.style.transform = "rotate(0deg)";
                  spinIsActive = false;
                } else showSlipData(d.slipData);
              } else Swal.fire("Failed", d.message, "error");
            } catch (e) {
              Swal.fire("Error", "Connection Error: " + e.message, "error");
            }
          },
        );
      }

      function startSpin() {
        if (spinIsActive) return;
        spinIsActive = true;
        const p = [0.05, 0.5, 0, 0.1, 1.0, 0.2],
          r = Math.random();
        let idx = r < 0.1 ? 4 : r < 0.3 ? 1 : r < 0.6 ? 5 : r < 0.8 ? 3 : 0;
        document.getElementById("wheelCanvas").style.transition =
          "transform 4s cubic-bezier(0.2, 0.8, 0.2, 1)";
        document.getElementById("wheelCanvas").style.transform =
          `rotate(${360 * 5 + (270 - (idx * 60 + 30))}deg)`;
        setTimeout(() => {
          if (p[idx] > 0) {
            fetch("/api/reward/cashback", {
              method: "POST",
              headers: authHeaders,
              body: JSON.stringify({
                username: user.username,
                amount: p[idx],
                refId: currentSlipData.refId,
              }),
            })
              .then((r) => r.json())
              .then((d) => {
                if (d.success) {
                  user.balance = d.balance;
                  sessionStorage.setItem("user", JSON.stringify(user));
                  new Audio(
                    "https://notificationsounds.com/storage/sounds/file-sounds-1148-juntos.mp3",
                  ).play();
                  Swal.fire({
                    icon: "success",
                    title: `You won $${p[idx].toFixed(2)}!`,
                    text: "Cashback added.",
                    confirmButtonColor: "#004d40",
                  }).then(() => finishSpin());
                }
              });
          } else
            Swal.fire({
              icon: "info",
              title: "Oops!",
              text: "Better luck next time.",
              confirmButtonColor: "#004d40",
            }).then(() => finishSpin());
        }, 4100);
      }

      function skipSpin() {
        finishSpin();
      }
      function finishSpin() {
        document.getElementById("spinModal").style.display = "none";
        showSlipData(currentSlipData);
      }

      function showSlipData(d) {
        const isKHR = d.currency === "KHR",
          sign = isKHR ? "៛" : "$";
        document.getElementById("slipAmount").innerText = isKHR
          ? `${Math.abs(d.amount).toLocaleString("en-US")} ${sign}`
          : `${sign}${Math.abs(d.amount).toFixed(2)}`;
        document.getElementById("slipRef").innerText = d.refId;
        document.getElementById("slipHash").innerText = d.hash || "N/A";
        document.getElementById("slipSender").innerText = user.username;
        document.getElementById("slipReceiver").innerText =
          d.partner || d.receiverName;
        document.getElementById("slipMethod").innerText =
          d.trxMethod ||
          (urlParamsGlobal.has("acc") ? "QR Scan" : "Account Input");
        document.getElementById("slipDate").innerText = d.date;
        document.getElementById("slipRemark").innerText = d.remark || "-";
        document.getElementById("slipModal").style.display = "flex";
      }

      function saveSlipImage() {
        document.querySelector(".slip-actions").style.display = "none";
        html2canvas(document.getElementById("captureArea")).then((c) => {
          let l = document.createElement("a");
          l.download = `Slip-${Date.now()}.png`;
          l.href = c.toDataURL();
          l.click();
          document.querySelector(".slip-actions").style.display = "flex";
        });
      }

      function returnToShopOrDashboard() {
        if (callbackUrl) window.location.href = new URL(callbackUrl).origin;
        else if (orderId) {
          window.close();
          setTimeout(() => {
            window.location.href = "dashboard.html";
          }, 300);
        } else window.location.href = "dashboard.html";
      }
    </script>
